<style>
:root{
  --paper:#ffffff; --bg:#EEF1F4; --ink:#1a1a1a; --muted:#56606b;
  --fase:#D0191C; --neutro:#1F5FBF; --flow:#F2B400; --ok:#2E8B3E; --warn:#C0392B;
  --panel:#ffffff; --line:#cfd6de; --btn:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#15191e; --ink:#eef1f4; --muted:#a9b3bd; --panel:#1f252c; --line:#36404b; --btn:#262d35; }
}
:root[data-theme="dark"]{ --bg:#15191e; --ink:#eef1f4; --muted:#a9b3bd; --panel:#1f252c; --line:#36404b; --btn:#262d35; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:18px;line-height:1.45}
main{max-width:1120px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(1.5rem,3.2vw,2.2rem);margin:0 0 4px;line-height:1.15}
.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.sheet{background:var(--paper);border-radius:10px;border:1px solid var(--line);padding:8px;overflow-x:auto}
.sheet svg{display:block;width:100%;height:auto;max-height:82vh;min-width:760px}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.explain{min-height:9.5em;font-size:1.08rem}
.explain b{color:inherit}
.explain .k{background:#FFF1C2;color:#1a1a1a;border-radius:4px;padding:0 4px;font-weight:700}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;border-radius:10px;border:2px solid var(--line);background:var(--btn);color:var(--ink);padding:14px 10px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:3px solid var(--flow);outline-offset:2px}
#bS1{border-color:#2E8B3E}
#bS1.on{background:#2E8B3E;color:#fff}
#bS0{border-color:#C0392B}
#bS0.on{background:#C0392B;color:#fff}
.small{font-size:.9rem;font-weight:400;display:block;opacity:.8}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}
.toggle input{width:22px;height:22px;accent-color:#2E8B3E}
.status{display:flex;align-items:center;gap:14px}
.motor{width:86px;height:86px;flex:none}
.state{font-size:1.25rem;font-weight:700}
.state.run{color:var(--ok)} .state.stop{color:var(--muted)}
.foot{color:var(--muted);font-size:.9rem;margin-top:14px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-family:inherit;font-size:.85em}
/* diagrama */
.w{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.wf{stroke:var(--fase)} .wn{stroke:var(--neutro)}
.sym{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.symf{fill:#fff;stroke:#111;stroke-width:3}
.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:7 5}
.t{font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;fill:#111;font-size:15px}
.name{font-weight:700;font-size:18px}
.flow{fill:none;stroke:var(--flow);stroke-width:7;stroke-linecap:round;stroke-dasharray:4 14;opacity:0;transition:opacity .15s}
.flow.on{opacity:1;animation:run .7s linear infinite}
@keyframes run{to{stroke-dashoffset:-18}}
.blade{transition:transform .18s ease}
.fb{transition:opacity .25s}
.fb.off{opacity:.18}
.glow{fill:#FFE066;opacity:0;transition:opacity .2s}
.glow.on{opacity:.9}
.coilfill{transition:fill .2s}
.hl{fill:none;stroke:var(--flow);stroke-width:4;opacity:0;transition:opacity .25s}
.hl.on{opacity:1}
@media (prefers-reduced-motion: reduce){ .flow.on{animation:none;stroke-dasharray:none;opacity:.55} .blade{transition:none} }
.rotor{transform-origin:43px 43px}
.spin{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.hit{cursor:pointer}
.hit:hover .hitbox,.hit:focus-visible .hitbox{stroke:#F2B400;stroke-opacity:.9}
.hit:focus{outline:none}
.hitbox{fill:transparent;stroke:transparent;stroke-width:2;stroke-dasharray:4 4;rx:8}
.leds{display:flex;gap:18px;align-items:center}
.led{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:26px;height:26px;border-radius:50%;border:3px solid #333;background:#fff;transition:background .2s,box-shadow .2s}
.dot.g.on{background:#3DBB4E;box-shadow:0 0 14px #3DBB4E}
.dot.r.on{background:#E0413A;box-shadow:0 0 14px #E0413A}
.kmicon{width:74px;height:48px;flex:none}

.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.bottom{grid-template-columns:1fr}}
.controls3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#bF2{border-color:#D98E04}
#bF2.on{background:#D98E04;color:#fff}
.hot{fill:#FFB36B !important;transition:fill 1.2s}
.lab{font-size:13px;fill:#555}
.title2{font-size:17px;font-weight:700;fill:#1F4E79}
.dot.y.on{background:#F2C200;box-shadow:0 0 14px #F2C200}
.leds{flex-wrap:wrap}
</style>

            <button id="bS0" aria-pressed="false">Paro -S0<span class="small">mantén pulsado · tecla P</span></button>
            <button id="bF2">Sobrecarga en el motor<span class="small">tecla T</span></button>
            <button id="bRST">Rearmar -F2 (RESET)<span class="small">tecla R</span></button>
            <button id="bQ1">Abrir -Q1 (fuerza)</button>

</main>
<script>
(function(){
  var st = { s1:false, s0:false, fb:true, q1:true, q2:true, f2:false, heat:false, coil:false };
  var last = 'inicio';
  var $ = function(id){ return document.getElementById(id); };
  function pathOK(){ return st.q2 && !st.f2 && !st.s0 && (st.s1 || (st.fb && st.coil)); }
  var timer = null;
  function settle(){
    var want = pathOK();
    if (want === st.coil) { render(); return; }
    clearTimeout(timer);
    timer = setTimeout(function(){ st.coil = want; render(); settle(); }, want ? 260 : 160);
    render();
  }
  function rot(id, deg){ $(id).style.transform = 'rotate(' + deg + 'deg)'; }
  function running(){ return st.coil && st.q1; }
  function msg(){
    if (st.heat) return '<b>Sobrecarga:</b> el motor consume más corriente de la normal (está frenado o tiene demasiada carga). La corriente pasa por los calefactores del <b>-F2</b> y los bimetales se calientan y se curvan…';
    if (st.f2) return '<b>Ha saltado el relé térmico -F2.</b> En el mando se abre su <span class="k">95-96</span>: la bobina de -KM1 se queda sin corriente, los contactos principales se abren y <b>el motor se para</b>. A la vez se cierra su <span class="k">97-98</span> y se enciende <b>H3</b> (fallo térmico). Fíjate: el térmico <b>no corta el motor directamente</b>, lo hace el contactor. Pulsa <b>RESET</b> para rearmarlo; el motor no arranca solo.';
    if (!st.q2) return '<b>-Q2 abierto:</b> el circuito de <b>mando</b> se queda sin tensión. -KM1 se suelta, el motor se para y se apagan todos los pilotos. Al cerrarlo, el motor no arranca solo: hay que pulsar marcha.';
    if (st.coil && !st.q1) return '<b>-KM1 está activado, pero -Q1 (fuerza) está abierto.</b> Los contactos principales <span class="k">1-2, 3-4, 5-6</span> están cerrados, pero no llega corriente al motor. Fuerza y mando son <b>dos circuitos distintos</b>.';
    if (st.s0 && !st.coil) return '<b>Pulsas -S0 (paro).</b> Se abre su <span class="k">1-2</span>, la bobina se queda sin corriente y -KM1 se suelta: se abren sus contactos principales y el motor se para. También se abre el <span class="k">13-14</span>, así que al soltar -S0 el motor <b>sigue parado</b>.';
    if (st.s1 && st.coil) return '<b>Pulsas -S1 (marcha).</b> La bobina de -KM1 recibe corriente por el <span class="k">3-4</span> de -S1. -KM1 se activa: se cierran sus contactos principales <span class="k">1-2, 3-4, 5-6</span> y <b>arranca el motor</b>. Se enciende H1, se apaga H2 (su 61-62 se abre) y se cierra el <span class="k">13-14</span>. <b>Ahora suelta -S1.</b>';
    if (!st.s1 && st.coil && st.fb) return '<b>Has soltado -S1 y el motor sigue girando.</b> La bobina recibe ahora la corriente por el <span class="k">13-14</span> de -KM1: <b>realimentación</b>. Prueba el botón <b>Sobrecarga</b> para ver actuar al relé térmico.';
    if (last === 'soltarSinFb') return '<b>Sin realimentación, al soltar -S1 el motor se para.</b> Hace falta el 13-14 de -KM1 en paralelo con -S1.';
    if (last === 'noSobrecarga') return 'Para que haya sobrecarga, <b>el motor tiene que estar en marcha</b>. Arráncalo primero con -S1.';
    return 'Motor parado. -KM1 en reposo: sus contactos principales están abiertos y el <span class="k">61-62</span> cerrado, por eso <b>H2</b> está encendido. Mantén pulsado <b>-S1</b> (marcha).';
  }
  function render(){
    var c = st.coil, run = running();
    var h2 = st.q2 && !c, h3 = st.q2 && st.f2;
    rot('kS1', st.s1 ? 32 : 0); $('aS1').style.transform = st.s1 ? 'translateX(12px)' : '';
    rot('kS0', st.s0 ? -45 : 0); $('aS0').style.transform = st.s0 ? 'translateX(12px)' : '';
    ['kQ10','kQ11','kQ12'].forEach(function(k){ rot(k, st.q1 ? 32 : 0); });
    $('aQ1').style.transform = st.q1 ? '' : 'translateX(-10px)';
    rot('kQ2', st.q2 ? 32 : 0); $('aQ2').style.transform = st.q2 ? '' : 'translateX(-10px)';
    ['kKMp0','kKMp1','kKMp2','kKM'].forEach(function(k){ rot(k, c ? 32 : 0); });
    rot('kKM2', c ? -45 : 0);
    rot('k9596', st.f2 ? -45 : 0);
    rot('k9798', st.f2 ? 32 : 0);
    ['thF0','thF1','thF2','thM'].forEach(function(k){ $(k).classList.toggle('hot', st.heat || st.f2); });
    $('fbGroup').classList.toggle('off', !st.fb); $('cut').style.display = st.fb ? 'none' : '';
    ['fP0','fP1','fP2'].forEach(function(k){ $(k).classList.toggle('on', run); });
    $('fTop').classList.toggle('on', st.q2 && (c || h2 || h3));
    $('fMain').classList.toggle('on', c);
    $('fS1').classList.toggle('on', c && st.s1);
    $('fKM').classList.toggle('on', c && st.fb);
    $('fCoil').classList.toggle('on', c);
    $('fH1').classList.toggle('on', c);
    $('fH2').classList.toggle('on', h2);
    $('fH3').classList.toggle('on', h3);
    $('hlKM').classList.toggle('on', c && st.fb && !st.s1);
    $('lblFb').style.opacity = (c && st.fb && !st.s1) ? 1 : 0;
    $('coil').style.fill = c ? '#FFE9A8' : '#fff';
    $('glow1').classList.toggle('on', c); $('glow2').classList.toggle('on', h2); $('glow3').classList.toggle('on', h3);
    $('dH1').classList.toggle('on', c); $('dH2').classList.toggle('on', h2); $('dH3').classList.toggle('on', h3);
    $('rotor').classList.toggle('spin', run);
    $('rotorM').style.animation = run ? 'spin .6s linear infinite' : 'none';
    $('state').textContent = run ? 'Motor en marcha' : (st.f2 ? 'Motor parado por el térmico' : 'Motor parado');
    $('state').className = 'state ' + (run ? 'run' : 'stop');
    $('bS1').classList.toggle('on', st.s1); $('bS0').classList.toggle('on', st.s0);
    $('bF2').classList.toggle('on', st.heat || st.f2);
    $('bQ1').textContent = st.q1 ? 'Abrir -Q1 (fuerza)' : 'Cerrar -Q1 (fuerza)';
    $('bQ2').textContent = st.q2 ? 'Abrir -Q2 (mando)' : 'Cerrar -Q2 (mando)';
    $('explain').innerHTML = msg();
  }
  function press(which, down){
    if (st[which] === down) return;
    st[which] = down;
    last = (which === 's1' && !down && !st.fb) ? 'soltarSinFb' : which + (down ? 'On' : 'Off');
    settle();
  }
  function hold(el, which){
    el.addEventListener('pointerdown', function(e){ e.preventDefault(); try{ el.setPointerCapture(e.pointerId); }catch(_){} press(which, true); });
    ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){ el.addEventListener(ev, function(){ press(which, false); }); });
    el.addEventListener('keydown', function(e){ if ((e.key === ' ' || e.key === 'Enter') && !e.repeat){ e.preventDefault(); press(which, true); } });
    el.addEventListener('keyup', function(e){ if (e.key === ' ' || e.key === 'Enter'){ press(which, false); } });
  }
  hold($('bS1'), 's1'); hold($('bS0'), 's0'); hold($('gS1'), 's1'); hold($('gS0'), 's0');
  var heatT = null;
  function overload(){
    if (st.f2 || st.heat) return;
    if (!running()) { last = 'noSobrecarga'; render(); return; }
    st.heat = true; render();
    heatT = setTimeout(function(){ st.heat = false; st.f2 = true; last = 'f2'; settle(); }, 1600);
  }
  function reset(){ clearTimeout(heatT); st.heat = false; if (st.f2) { st.f2 = false; last = 'reset'; } settle(); }
  function f2click(){ if (st.f2) reset(); else overload(); }
  function tq(k){ st[k] = !st[k]; last = k; settle(); }
  function clickable(el, fn){
    el.addEventListener('click', fn);
    el.addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); fn(); } });
  }
  $('bF2').addEventListener('click', overload); $('bRST').addEventListener('click', reset);
  $('bQ1').addEventListener('click', function(){ tq('q1'); }); $('bQ2').addEventListener('click', function(){ tq('q2'); });
  clickable($('gQ1'), function(){ tq('q1'); }); clickable($('gQ2'), function(){ tq('q2'); });
  clickable($('gF2'), f2click); clickable($('gF2m'), f2click);
  $('fb').addEventListener('change', function(){ st.fb = this.checked; last = 'fb'; settle(); });
  document.addEventListener('keydown', function(e){
    if (e.repeat) return;
    var tg = e.target; if (tg.tagName === 'BUTTON' || tg.tagName === 'INPUT' || (tg.getAttribute && tg.getAttribute('role') === 'button')) return;
    var k = e.key.toLowerCase();
    if (k === 'm') press('s1', true);
    if (k === 'p') press('s0', true);
    if (k === 't') overload();
    if (k === 'r') reset();
  });
  document.addEventListener('keyup', function(e){
    var k = e.key.toLowerCase();
    if (k === 'm') press('s1', false);
    if (k === 'p') press('s0', false);
  });
  render();
})();
</script>
