<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>Test Temas 5 y 6 · Automatismos 1MB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f1; --card:#ffffff; --ink:#1d2320; --muted:#5d6862; --line:#d9e0d4;
  --green:#4e8a1e; --green-soft:#e6f2da; --red:#c0392b; --red-soft:#fbe4e1;
  --ok:#2e7d32; --ok-soft:#e3f3e4; --yellow:#b7860b; --yellow-soft:#fdf5dc;
  --blue:#1f5fbf; --btn:#eef2ea; --on-green:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#141816; --card:#1e2420; --ink:#e7ece8; --muted:#a3ada6; --line:#34403a;
  --green:#8bc34a; --green-soft:#24331b; --red:#ef6b5d; --red-soft:#3a201d;
  --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
  --blue:#7aa7f0; --btn:#262e29; --on-green:#10200a; --shadow:0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --card:#1e2420; --ink:#e7ece8; --muted:#a3ada6; --line:#34403a;
    --green:#8bc34a; --green-soft:#24331b; --red:#ef6b5d; --red-soft:#3a201d;
    --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
    --blue:#7aa7f0; --btn:#262e29; --on-green:#10200a; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.45}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--green);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.back{border:1px solid var(--line);background:var(--btn);color:var(--ink);padding:6px 12px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--green)}
.crumbs{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--green);text-decoration:none}
.crumbs b{color:var(--ink)}
.theme{border:1px solid var(--line);background:var(--btn);color:var(--ink);width:38px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:6px 0 2px;font-weight:700}
h1 span{color:var(--green)}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.box{border-left:5px solid var(--green);background:var(--green-soft);border-radius:8px;padding:10px 14px;margin:12px 0}
.box .lbl{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--green);display:block;margin-bottom:2px}
.box.why{border-color:var(--yellow);background:var(--yellow-soft)}
.box.why .lbl{color:var(--yellow)}
fieldset{border:none;padding:0;margin:0 0 14px}
legend{font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip>span{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--btn);cursor:pointer;font-size:15px;user-select:none}
.chip input:checked+span{border-color:var(--green);background:var(--green-soft);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.cnt{color:var(--muted);font-size:13px}
.go{background:var(--green);color:var(--on-green);border:none;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.ghost{background:var(--btn);color:var(--ink);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--btn)}
.tag.nq{font-weight:700;color:var(--ink);border-color:var(--green)}
.tag.d{border-color:var(--red);color:var(--red)}
.score{margin-left:auto;font-weight:700;color:var(--ink)}
.qtext{font-size:19px;font-weight:700;margin:6px 0 12px}
figure{margin:0 0 12px;text-align:center}
figure img{max-width:100%;max-height:520px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line);cursor:zoom-in}
figcaption{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.card.resume{border-left:5px solid var(--yellow);background:var(--yellow-soft)}
.pt{display:inline-block;min-width:1.5em;height:1.5em;line-height:calc(1.5em - 3px);padding:0 .12em;margin:0 .06em;border-radius:999px;background:#FFDD40;color:#111;border:1.5px solid #111;font-weight:700;font-size:.82em;text-align:center;vertical-align:.1em;font-style:normal}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.verdict{font-weight:700;font-size:18px;margin-top:12px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--red)}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.big{font-size:44px;font-weight:700;color:var(--green);margin:0}
.review{border-top:1px solid var(--line);padding:12px 0}
.review .rq{font-weight:700}
.review .ra{color:var(--ok);font-weight:700}
.review .ry{color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.tw{overflow-x:auto;margin:0 0 6px}
.tt{border-collapse:collapse;margin:0 auto;font-size:15px;text-align:center}
.tt th,.tt td{border:1.5px solid var(--line);padding:6px 10px;min-width:44px}
.tt th{background:var(--green-soft);font-weight:700}
.tt td{font-weight:700;font-size:17px}
.tt td.qq{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow)}
.cgrp{margin:0 0 10px}
.cgrp h3{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:6px 0 6px}
.cbtns{display:flex;gap:8px;margin:0 0 8px}
.cbtns button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.jump{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:8px;margin:0 0 12px}
.jump>.go{padding:8px 14px;font-size:15px}
.jump>.go.ghost[aria-expanded=true]{border-color:var(--green);background:var(--green-soft)}
.qgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:var(--shadow)}
.qgrid[hidden]{display:none}
.qgrid button{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);border-radius:8px;padding:7px 0;cursor:pointer}
.qgrid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qgrid button.ko{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qgrid button.cur{outline:3px solid var(--green);outline-offset:1px}
.qgrid .leg{grid-column:1/-1;font-size:13px;color:var(--muted);margin:2px 0 0}
.qgrid .go.fin{grid-column:1/-1;margin-top:4px;color:var(--on-green);background:var(--green);border:none;padding:10px}
@media (max-width:480px){.jump{gap:6px}.jump .tx{display:none}.jump>.go{padding:8px 10px;font-size:14px}}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px;padding:8px}
@media (max-width:560px){body{font-size:16px}.qtext{font-size:17px}h1{font-size:22px}.crumbs{font-size:12px}}

/* ---------- mapa de preguntas y marcador ---------- */
.qmap,.qbar,.qsheet{display:none}
.qmap h2{margin:0 0 8px;font-size:15px}
.qblk{margin:0 0 8px}.qblk>span{display:block;font-size:11px;color:var(--muted);margin:0 0 3px}
.qblk .g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.qblk button{font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);border-radius:6px;padding:5px 0;cursor:pointer}
.qblk button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qblk button.ko{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qblk button.cur{outline:3px solid var(--green);outline-offset:1px}
.qmap .leg{font-size:11px;color:var(--muted);margin:6px 0 0}
.qmap .leg i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--line);margin:0 3px 0 6px;vertical-align:-1px}
.qmap .leg i:first-child{margin-left:0}
.qmap .leg i.ok{background:var(--ok-soft);border-color:var(--ok)}.qmap .leg i.ko{background:var(--red-soft);border-color:var(--red)}
.sc{font-size:15px;margin:0 0 6px}.sc b{font-size:22px;margin-right:4px}.sc.ok b{color:var(--ok)}.sc.ko b{color:var(--red)}
.sc.nota{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.sc small{display:block;color:var(--muted);font-size:11px}
.qmap .fin,.qsheet .fin{width:100%;margin-top:8px;font-size:14px;padding:8px}
@media (min-width:1240px){
  body.inq .qmap{display:block;position:fixed;top:76px;max-height:calc(100vh - 92px);overflow:auto;width:min(230px,calc((100vw - 860px)/2 - 30px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
  body.inq .qmap.l{right:calc(50% + 444px)} body.inq .qmap.r{left:calc(50% + 444px)}
}
@media (max-width:1239px){
  body.inq .qbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));cursor:pointer;box-shadow:0 -4px 12px rgba(0,0,0,.15)}
  .qbar .segs{display:flex;gap:1px;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
  .qbar .segs i{flex:1;background:var(--btn)}.qbar .segs i.ok{background:var(--ok)}.qbar .segs i.ko{background:var(--red)}.qbar .segs i.cur{box-shadow:inset 0 0 0 2px var(--ink)}
  .qbar .tx{font-size:14px;font-weight:700;margin-top:4px;display:flex;gap:6px;align-items:center}.qbar .tx .ok{color:var(--ok)}.qbar .tx .ko{color:var(--red)}.qbar .more{margin-left:auto;color:var(--muted);font-weight:400}
  body.inq .qsheet{display:block;position:fixed;left:0;right:0;bottom:46px;max-height:62vh;overflow:auto;z-index:14;background:var(--card);border-top:1px solid var(--line);padding:10px 12px 14px;box-shadow:0 -6px 16px rgba(0,0,0,.25)}
  body.inq .qsheet[hidden]{display:none}
  .qsheet .qblk .g{grid-template-columns:repeat(10,1fr)}
  .qsheet .qblk button{padding:8px 0}
  body.inq main{padding-bottom:110px}
}
</style>
</head>

El bimetal, cuando se calienta"], "j": "Es un cortocircuito: salta la parte magnética (la bobina), en unos 0,01 s.", "img": null, "cap": "", "cat": ["magneto", "protec"]}, {"n": 6, "ans": "a", "tema": "T6", "t": "T6 · 6.1 y 6.9", "dif": "M", "tipo": "TEO", "q": "¿De qué protege un fusible aM?", "ok": "Solo de cortocircuito", "d": ["De sobrecarga y de cortocircuito", "Solo de sobrecarga", "De derivación a tierra"], "j": "El aM es el fusible de los motores: aguanta el pico de arranque, pero no ve las sobrecargas.", "img": null, "cap": "", "cat": ["fusibles", "protec"]}, {"n": 7, "ans": "c", "tema": "T6", "t": "T6 · 6.1 (¿por qué?) y 6.7", "dif": "D", "tipo": "TEO", "q": "¿Por qué el magnetotérmico no protege al motor de una sobrecarga?", "ok": "Porque su calibre es mayor que la corriente del motor", "d": ["Porque solo tiene parte magnética", "Porque salta siempre antes que el térmico", "Porque está antes del contactor"], "j": "Si el motor se sobrecarga un poco, el magnetotérmico ni se entera. Para eso está el relé térmico.", "img": null, "cap": "", "cat": ["magneto", "protec", "termico"]}, {"n": 8, "ans": "d", "tema": "T6", "t": "T6 · 6.2", "dif": "M", "tipo": "CAL", "q": "Placa de un motor de 3 kW: caja Y 400 V – 6,4 A y caja Δ 230 V – 11,0 A. Se conecta en estrella. ¿Cuál es su IB?", "ok": "6,4 A", "d": ["11,0 A", "17,4 A (la suma)", "3 A"], "j": "Se conecta en estrella → se lee la caja Y: 6,4 A.", "img": null, "cap": "", "cat": ["placa"]}, {"n": 9, "ans": "c", "tema": "T6", "t": "T6 · 6.2 (¡OJO!)", "dif": "D", "tipo": "MAL", "q": "Ese motor de 3 kW va en estrella (6,4 A), pero un compañero lee la caja Δ (11,0 A) y lo ajusta todo con ese dato. ¿Qué pasa?", "ok": "El térmico queda muy alto: el motor se puede quemar", "d": ["El térmico salta en el funcionamiento normal del motor", "Nada: las dos cajas valen", "El motor gira al revés"], "j": "El motor pide 6,4 A. Con el térmico a 11 A, una sobrecarga no lo haría saltar.", "img": null, "cap": "", "cat": ["placa", "termico"]}, {"n": 10, "ans": "d", "tema": "T6", "t": "T6 · 6.2 (¡OJO!) / Ejercicio 3 d", "dif": "D", "tipo": "MAL", "q": "Motor de 11 kW: caja Δ 400 V – 21,5 A y caja Y 690 V – 12,4 A. Va en triángulo, pero se dimensiona con 12,4 A. ¿Qué pasa?", "ok": "Las protecciones saltan en el funcionamiento normal del motor", "d": ["El motor se quema sin que salte nada", "El cable se queda corto", "Nada: 12,4 A es más seguro"], "j": "El motor pide 21,5 A. Con un magnetotérmico de 16 A y el térmico a 12,4 A, saltan con el motor trabajando normal.", "img": null, "cap": "", "cat": ["magneto", "placa", "termico"]}, {"n": 11, "ans": "b", "tema": "T6", "t": "T6 · 6.5 (regla de oro)", "dif": "M", "tipo": "CAL", "q": "Un motor pide IB = 6,4 A y lleva cable de 1,5 mm² (aguanta 16,5 A). ¿Qué calibres de magnetotérmico valen?", "ok": "El de 10 A y el de 16 A", "d": ["Solo el de 10 A, por ser el más cercano", "Solo el de 16 A", "El de 6 A y el de 10 A"], "j": "Vale cualquier calibre que quede entre lo que pide el motor (6,4 A) y lo que aguanta el cable (16,5 A): el de 10 A y el de 16 A son igual de buenos. El magnetotérmico protege el cable; al motor lo protege el térmico.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["cable", "calibre", "magneto", "regla"]}, {"n": 12, "ans": "a", "tema": "T6", "t": "T6 · 6.5 (regla de oro)", "dif": "M", "tipo": "CAL", "q": "Un motor pide IB = 21,5 A y lleva cable de 4 mm² (aguanta 31 A). ¿Qué calibre vale?", "ok": "25 A", "d": ["20 A", "32 A", "40 A"], "j": "El calibre tiene que quedar entre 21,5 A y 31 A: solo cabe el de 25 A. El de 20 A saltaría en el funcionamiento normal del motor y el de 32 A ya no protege ese cable.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["cable", "calibre", "magneto", "regla"]}, {"n": 13, "ans": "c", "tema": "T6", "t": "T6 · 6.3 (¡OJO!) y 6.5", "dif": "M", "tipo": "TEO", "q": "¿Qué pasa si pones un calibre más pequeño que IB?", "ok": "Salta en el funcionamiento normal del motor", "d": ["El cable se calienta sin que salte nada", "El motor arranca más despacio", "Nada: queda más protegido"], "j": "Si In < IB, la protección salta en cuanto la máquina trabaja.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["calibre", "regla"]}, {"n": 14, "ans": "d", "tema": "T6", "t": "T6 · 6.4 / Ejercicio 1 b", "dif": "D", "tipo": "CAL", "q": "¿Cuál es el magnetotérmico más grande que puede proteger un cable de 4 mm²?", "ok": "25 A", "d": ["32 A", "31 A", "20 A"], "j": "El cable de 4 mm² aguanta 31 A. El de 32 A ya pasa de 31 (¡trampa!), así que el máximo es 25 A. De 31 A no se fabrican.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["cable", "calibre"]}, {"n": 15, "ans": "b", "tema": "T6", "t": "T6 · 6.4 / Ejercicio 1 c", "dif": "M", "tipo": "CAL", "q": "Tienes un magnetotérmico de 32 A. ¿Cuál es el cable más fino que vale?", "ok": "6 mm²", "d": ["4 mm²", "2,5 mm²", "10 mm²"], "j": "El de 4 mm² solo aguanta 31 A. El de 6 mm² aguanta 40 A: 32 ≤ 40.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["cable"]}, {"n": 16, "ans": "a", "tema": "T6", "t": "T6 · 6.4 (¿por qué?)", "dif": "D", "tipo": "MAL", "q": "Un magnetotérmico de 32 A con un cable de 4 mm² (Iz = 31 A). ¿Cuál es el problema?", "ok": "El cable se puede calentar de más sin que salte", "d": ["Salta en el funcionamiento normal del motor", "Ninguno: 31 y 32 son casi lo mismo", "El motor no puede arrancar"], "j": "Con 32 A el cable ya sufre, y para el magnetotérmico todavía está todo bien. El cable, siempre por encima del calibre.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["cable", "regla"]}, {"n": 17, "ans": "d", "tema": "T6", "t": "T6 · 6.5 / Ejercicio 2 b", "dif": "D", "tipo": "CAL", "q": "Un motor pide 30 A y habías pensado en un cable de 4 mm² (aguanta 31 A). ¿Qué haces?", "ok": "Subir el cable a 6 mm² y poner 32 A", "d": ["Poner 25 A para que el cable valga", "Poner 32 A y dejar el cable de 4 mm²", "Poner 40 A y dejar el cable de 4 mm²"], "j": "Entre 30 A y 31 A no cabe ningún calibre: se sube la sección y se vuelve a intentar. Con 6 mm² (40 A) ya caben el de 32 A y el de 40 A. Nunca se baja el calibre por debajo de IB.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["cable", "calibre", "regla"]}, {"n": 18, "ans": "c", "tema": "T6", "t": "T6 · 6.5 / Ejercicio 2 c", "dif": "M", "tipo": "CAL", "q": "Motor de 19 A con cable de 2,5 mm² y magnetotérmico de 20 A. ¿Está bien dimensionado?", "ok": "Sí: 19 ≤ 20 ≤ 23", "d": ["No: el cable se queda corto", "No: hace falta el de 25 A", "Sí, pero solo con curva D"], "j": "IB = 19 A, In = 20 A, Iz = 23 A. Se cumple la regla de oro.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["cable", "calibre", "regla"]}, {"n": 19, "ans": "a", "tema": "T6", "t": "T6 · 6.5", "dif": "M", "tipo": "TEO", "q": "Al comprobar la regla de oro te sale In > Iz. ¿Qué se hace?", "ok": "Subir la sección del cable", "d": ["Bajar el calibre por debajo de IB", "Cambiar la curva C por la D", "Subir la ruleta del térmico"], "j": "Si el cable se queda corto, se sube la sección. El calibre no puede bajar de IB.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["cable", "regla"]}, {"n": 20, "ans": "b", "tema": "T6", "t": "T6 · 6.5 (en el taller)", "dif": "M", "tipo": "AVE", "q": "Un magnetotérmico salta muchas veces. ¿Qué es lo primero?", "ok": "Buscar por qué salta", "d": ["Poner uno de más calibre", "Cambiarlo por uno de curva D", "Subir la ruleta del térmico"], "j": "No se pone uno más grande «para que aguante». Y si de verdad hace falta más calibre, también hay que cambiar el cable.", "img": null, "cap": "", "cat": ["averias", "magneto"]}, {"n": 21, "ans": "a", "tema": "T6", "t": "T6 · 6.6 (las cuatro zonas)", "dif": "D", "tipo": "CUR", "q": "Por un magnetotérmico de 16 A pasan 17 A todo el día (1,06 veces). ¿Salta?", "ok": "No salta", "d": ["Sí, entre 20 s y 200 s", "Sí, al instante", "Sí, a los 0,3 s"], "j": "Hasta 1,13 veces el calibre es la zona de trabajo normal: no salta nunca.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["curvas", "magneto"]}, {"n": 22, "ans": "c", "tema": "T6", "t": "T6 · 6.6 (ejemplo)", "dif": "M", "tipo": "CUR", "q": "Magnetotérmico de 16 A, curva C. Pasan 32 A. ¿Qué ocurre?", "ok": "Zona térmica: entre 20 s y 200 s", "d": ["No salta", "Zona dudosa: puede saltar al instante", "Zona magnética: salta en 0,01 s"], "j": "32 / 16 = 2 veces. Entre 1,13 y 5 veces es la zona térmica: mira en la curva (o en la tabla) los tiempos de 2 veces.", "img": "fig26.png", "cap": "Curva de disparo de un magnetotérmico de curva C.", "cat": ["curvas", "magneto"]}, {"n": 23, "ans": "d", "tema": "T6", "t": "T6 · 6.6 (ejemplo)", "dif": "M", "tipo": "CUR", "q": "Magnetotérmico de 16 A, curva C. Pasan 96 A. ¿Qué ocurre?", "ok": "Zona dudosa: puede saltar al instante… o no", "d": ["Zona térmica: salta entre 4 s y 40 s", "Zona magnética: salta seguro en 0,01 s", "No salta"], "j": "96 / 16 = 6 veces. En la curva C, entre 5 y 10 veces es la zona dudosa: no te puedes fiar.", "img": "fig26.png", "cap": "Curva de disparo de un magnetotérmico de curva C.", "cat": ["curvas", "magneto"]}, {"n": 24, "ans": "b", "tema": "T6", "t": "T6 · 6.6 (ejemplo)", "dif": "M", "tipo": "CUR", "q": "Magnetotérmico de 16 A, curva C. Pasan 200 A. ¿Qué ocurre?", "ok": "Zona magnética: salta en 0,01 s", "d": ["Zona dudosa: puede saltar o no", "Zona térmica: salta entre 0,3 s y 2,5 s", "No salta"], "j": "200 / 16 = 12,5 veces. En la curva C, 10 veces o más es la zona magnética: es un cortocircuito.", "img": "fig26.png", "cap": "Curva de disparo de un magnetotérmico de curva C.", "cat": ["curvas", "magneto"]}, {"n": 25, "ans": "d", "tema": "T6", "t": "Ejercicio 6", "dif": "M", "tipo": "CUR", "q": "Un magnetotérmico de 32 A, curva C, tiene una falta de 10 veces su calibre. ¿Cuántos amperios son y qué pasa?", "ok": "320 A: salta al instante", "d": ["320 A: puede saltar o no", "42 A: salta en unos segundos", "3,2 A: no salta"], "j": "10 · 32 = 320 A. En la curva C, con 10 veces ya es zona magnética.", "img": "fig26.png", "cap": "Curva de disparo de un magnetotérmico de curva C.", "cat": ["curvas", "magneto"]}, {"n": 26, "ans": "c", "tema": "T6", "t": "T6 · 6.6 (las tres curvas)", "dif": "M", "tipo": "TEO", "q": "¿Qué cambia entre las curvas B, C y D?", "ok": "Dónde empieza la parte magnética", "d": ["El calibre", "La parte térmica", "Los amperios del motor"], "j": "La parte térmica es la misma en las tres. La magnética empieza en 3 veces (B), 5 veces (C) o 10 veces (D).", "img": "fig27.png", "cap": "Curvas de disparo B, C y D juntas.", "cat": ["curvas"]}, {"n": 27, "ans": "a", "tema": "T6", "t": "Ejercicio 4 f", "dif": "D", "tipo": "CUR", "q": "Magnetotérmico de 20 A, curva D. Pasan 140 A. ¿Qué ocurre?", "ok": "Zona térmica: salta entre 0,6 s y 5 s", "d": ["Zona dudosa: puede saltar al instante", "Zona magnética: salta en 0,01 s", "No salta"], "j": "140 / 20 = 7 veces. En la curva D la magnética no empieza hasta 10 veces: todavía es zona térmica. Tiempos de la columna de 7.", "img": "fig27.png", "cap": "Curvas de disparo B, C y D juntas.", "cat": ["curvas", "magneto"]}, {"n": 28, "ans": "b", "tema": "T6", "t": "Ejercicio 4 f", "dif": "D", "tipo": "CUR", "q": "Magnetotérmico de 20 A, curva B. Pasan 60 A. ¿Qué ocurre?", "ok": "Zona dudosa: puede saltar", "d": ["Zona térmica: salta entre 4 s y 40 s", "Zona magnética: salta seguro", "No salta"], "j": "60 / 20 = 3 veces. En la curva B la zona dudosa va de 3 a 5 veces.", "img": "fig27.png", "cap": "Curvas de disparo B, C y D juntas.", "cat": ["curvas", "magneto"]}, {"n": 29, "ans": "c", "tema": "T6", "t": "Ejercicio 9 c", "dif": "D", "tipo": "CUR", "q": "Una línea de alumbrado muy larga lleva un magnetotérmico de 10 A. Un cortocircuito al final solo da 70 A. ¿Qué curva lo corta seguro y al instante?", "ok": "La B", "d": ["La C", "La D", "Cualquiera de las tres"], "j": "70 / 10 = 7 veces. Con la B (5 veces o más) ya es zona magnética. Con la C sería zona dudosa y con la D, térmica.", "img": "fig27.png", "cap": "Curvas de disparo B, C y D juntas.", "cat": ["curvas", "magneto"]}, {"n": 30, "ans": "a", "tema": "T6", "t": "T6 · 6.6 (pista)", "dif": "M", "tipo": "CUR", "q": "Estás en la zona térmica y las veces te salen 5,8, que no está en la tabla de tiempos. ¿Qué columna usas?", "ok": "La de 7 (la siguiente)", "d": ["La de 5 (la anterior)", "La media entre la de 5 y la de 7", "La de 10"], "j": "Se usa la columna siguiente: da un tiempo más corto y así te quedas del lado seguro.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["curvas"]}, {"n": 31, "ans": "d", "tema": "T6", "t": "T6 · 6.7 (ejemplo)", "dif": "M", "tipo": "CAL", "q": "Un motor de IB = 14,8 A arranca con un pico de 7 veces su corriente. ¿De cuántos amperios es el pico?", "ok": "103,6 A", "d": ["21,8 A", "2,1 A", "148 A"], "j": "Pico = veces de arranque · IB = 7 · 14,8 = 103,6 A.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["arranq"]}, {"n": 32, "ans": "b", "tema": "T6", "t": "T6 · 6.7 (ejemplo)", "dif": "D", "tipo": "CUR", "q": "Ese pico de 103,6 A, con un magnetotérmico de 16 A, son 6,5 veces. Si es de curva C, ¿arranca el motor?", "ok": "No vale: es zona dudosa", "d": ["Sí: 6,5 es menos que 10", "No: es zona magnética y salta seguro", "Sí: la curva C es la de los motores"], "j": "En la curva C, entre 5 y 10 veces es la zona dudosa. El pico tiene que quedar por debajo de 5.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["arranq", "curvas"]}, {"n": 33, "ans": "d", "tema": "T6", "t": "T6 · 6.7 (ejemplo)", "dif": "D", "tipo": "CUR", "q": "El mismo arranque (6,5 veces durante 0,5 s) con un magnetotérmico de curva D. ¿Arranca?", "ok": "Sí: es zona térmica y 0,5 s es menos que 0,6 s", "d": ["No: es zona dudosa", "No: 0,5 s es más que el tiempo mínimo", "Sí, porque la curva D no tiene parte térmica"], "j": "6,5 < 10: no salta la magnética. Columna de 7: tiempo mínimo 0,6 s. El arranque dura menos: arranca.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["arranq", "curvas"]}, {"n": 34, "ans": "c", "tema": "T6", "t": "T6 · 6.7 (otra solución)", "dif": "D", "tipo": "CAL", "q": "Para ese motor (pico de 103,6 A) queremos curva C. ¿Qué solución vale?", "ok": "Magnetotérmico de 25 A y cable de 4 mm²", "d": ["Magnetotérmico de 10 A y cable de 1,5 mm²", "Magnetotérmico de 20 A y cable de 1,5 mm²", "Dejar el de 16 A y subir la ruleta del térmico"], "j": "103,6 / 25 = 4,1 veces, menos de 5. Y el cable tiene que admitir 25 A: 4 mm². Con 20 A serían 5,2 veces: zona dudosa.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["arranq", "cable", "curvas"]}, {"n": 35, "ans": "a", "tema": "T6", "t": "T6 · 6.13 (ejemplo)", "dif": "D", "tipo": "CUR", "q": "Motor de 11 A que arranca con 6 veces durante 0,5 s. Magnetotérmico de 16 A, curva C: el pico es de 66 A, 4,1 veces. ¿Arranca?", "ok": "Sí: aguanta 1,2 s como mínimo", "d": ["No: está en la zona dudosa y puede saltar", "No: salta a los 0,5 s", "Sí, pero solo con cable de 4 mm²"], "j": "4,1 < 5: zona térmica. Columna siguiente (la de 5): tiempo mínimo 1,2 s, más que los 0,5 s del arranque.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["arranq", "curvas"]}, {"n": 36, "ans": "b", "tema": "T6", "t": "Ejercicio 9 a", "dif": "D", "tipo": "CUR", "q": "Magnetotérmico de 16 A para un motor con un pico de arranque de 70 A que dura 0,3 s. De la B a la D, ¿cuál es la primera curva que vale?", "ok": "La C", "d": ["La B", "La D", "Ninguna: hay que subir el calibre"], "j": "70 / 16 = 4,4 veces. En la B es zona dudosa (de 3 a 5). En la C es zona térmica y aguanta 1,2 s como mínimo.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["arranq", "curvas"]}, {"n": 37, "ans": "c", "tema": "T6", "t": "Ejercicio 9 b", "dif": "D", "tipo": "CUR", "q": "Magnetotérmico de 10 A para un transformador que al conectarlo da un pico de 90 A. ¿Qué curva hace falta?", "ok": "La D", "d": ["La B", "La C", "Da igual la curva"], "j": "90 / 10 = 9 veces. En la C es zona dudosa (de 5 a 10). En la D queda por debajo de 10.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["arranq", "curvas"]}, {"n": 38, "ans": "a", "tema": "T6", "t": "T6 · 6.8 (ejemplo)", "dif": "M", "tipo": "CAL", "q": "Motor de IB = 14,8 A. ¿Qué relé térmico eliges y dónde pones la ruleta?", "ok": "Rango 13-18 A, ruleta en 14,8 A", "d": ["Rango 13-18 A, ruleta en 18 A", "Rango 9-13 A, ruleta en 13 A", "Rango 18-25 A, ruleta en 18 A"], "j": "El rango tiene que contener la corriente de la placa, y la ruleta va justo en esa corriente (taraje: Ir = IB).", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["termico"]}, {"n": 39, "ans": "d", "tema": "T6", "t": "T6 · 6.8 (¡OJO!)", "dif": "M", "tipo": "TEO", "q": "¿Qué pasa si pones la ruleta del térmico por encima de la corriente de la placa?", "ok": "El motor puede quemarse sin que salte", "d": ["Salta en el funcionamiento normal del motor", "Salta el magnetotérmico", "El motor no arranca"], "j": "Por encima: el motor se puede quemar. Por debajo: salta en el funcionamiento normal del motor. Ni más ni menos: la de la placa.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["termico"]}, {"n": 40, "ans": "b", "tema": "T6", "t": "T6 · 6.13 (ejemplo)", "dif": "D", "tipo": "CAL", "q": "Motor de 5,5 kW en triángulo (caja Δ: 400 V – 11 A) que arranca con 6 veces durante 0,5 s. ¿Qué resultado es el correcto?", "ok": "Magnetotérmico de 16 A curva C, térmico 9-13 A a 11 A y cable de 1,5 mm²", "d": ["Magnetotérmico de 10 A curva C, térmico 9-13 A a 11 A y cable de 1,5 mm²", "Magnetotérmico de 16 A curva B, térmico 9-13 A a 13 A y cable de 1,5 mm²", "Magnetotérmico de 16 A curva C, térmico 13-18 A a 16 A y cable de 2,5 mm²"], "j": "IB = 11 A → 16 A. Pico 66 A = 4,1 veces: la B no vale, la C sí. Térmico con la ruleta en 11 A. Cable de 1,5 mm² (16,5 A): 11 ≤ 16 ≤ 16,5.", "img": "fig20.png", "cap": "Tablas para resolver: calibres, cables, tiempos, curvas y rangos del relé térmico.", "cat": ["cable", "calibre", "curvas", "regla", "termico"]}, {"n": 41, "ans": "d", "tema": "T6", "t": "T6 · 6.9 (ejemplo)", "dif": "M", "tipo": "CAL", "q": "Un motor de 21,5 A se protege con fusibles. ¿Qué pones?", "ok": "3 fusibles aM de 25 A y un relé térmico", "d": ["3 fusibles aM de 25 A, sin térmico", "1 fusible gG de 20 A", "3 fusibles aM de 20 A y un relé térmico"], "j": "Un fusible por fase, de un calibre igual o mayor que 21,5 A (el de 20 A se fundiría). Y con aM, siempre térmico.", "img": null, "cap": "", "cat": ["fusibles", "termico"]}, {"n": 42, "ans": "a", "tema": "T6", "t": "T6 · 6.9 (¿por qué?)", "dif": "M", "tipo": "TEO", "q": "¿Por qué un fusible aM lleva siempre un relé térmico?", "ok": "Porque el aM no ve las sobrecargas", "d": ["Porque el aM no corta los cortocircuitos", "Porque el aM no aguanta el arranque", "Porque lo necesita el contactor"], "j": "Un motor que pide un 30 % más durante una hora se quemaría con un aM. Para eso está el térmico.", "img": null, "cap": "", "cat": ["fusibles", "termico"]}, {"n": 43, "ans": "c", "tema": "T6", "t": "T6 · 6.10 (ejemplo)", "dif": "M", "tipo": "CAL", "q": "Motor de 6,4 A con guardamotor. Rangos: 4-6,3 A · 6,3-10 A · 10-14 A. ¿Cuál eliges y dónde pones la ruleta?", "ok": "El de 6,3-10 A, con la ruleta en 6,4 A", "d": ["El de 4-6,3 A, con la ruleta en 6,3 A", "El de 6,3-10 A, con la ruleta en 10 A", "El de 10-14 A, con la ruleta en 10 A"], "j": "Como el térmico: el rango que contiene la corriente de la placa y la ruleta en esa corriente.", "img": null, "cap": "", "cat": ["guarda"]}, {"n": 44, "ans": "b", "tema": "T6", "t": "T6 · 6.10", "dif": "D", "tipo": "CAL", "q": "La parte magnética de un guardamotor salta a unas 13 veces el máximo de su rango. En el de 6,3-10 A, ¿a cuántos amperios?", "ok": "130 A", "d": ["82 A", "13 A", "23 A"], "j": "13 · 10 = 130 A. El pico de un motor de 6,4 A (7 · 6,4 = 44,8 A) queda muy por debajo: arranca sin problema.", "img": null, "cap": "", "cat": ["arranq", "guarda"]}, {"n": 45, "ans": "d", "tema": "T6", "t": "T6 · 6.12", "dif": "M", "tipo": "TEO", "q": "¿Con qué se protege el circuito de mando?", "ok": "Con un magnetotérmico pequeño, -Q2", "d": ["Con el relé térmico -F1", "Con el mismo -Q1 de la fuerza", "Con nada: el mando pide muy poca corriente"], "j": "Las bobinas y los pilotos piden menos de 1 A. El mando lleva su propio magnetotérmico de 1 polo + neutro, o fusibles pequeños.", "img": null, "cap": "", "cat": ["magneto", "protec"]}, {"n": 46, "ans": "a", "tema": "T6", "t": "T6 · 6.11 (ejemplo)", "dif": "M", "tipo": "CAL", "q": "Los tres motores pueden funcionar a la vez. ¿Cuál es la IB de la línea general?", "ok": "24,7 A", "d": ["14,8 A (la del motor más grande)", "32 A (la suma de los calibres)", "8,2 A (la media)"], "j": "Se suman las corrientes de los motores: 6,4 + 14,8 + 3,5 = 24,7 A.", "img": "fig21.png", "cap": "Un cuadro con tres motores. Cada línea roja del dibujo son tres cables (L1, L2 y L3). Las letras marcan dónde se pone la pinza.", "cat": ["esquemas", "general"]}, {"n": 47, "ans": "c", "tema": "T6", "t": "T6 · 6.11 (ejemplo)", "dif": "M", "tipo": "CAL", "q": "La línea general pide 24,7 A y lleva cable de 4 mm² (aguanta 31 A). ¿Qué calibre lleva -Q0?", "ok": "25 A", "d": ["16 A", "20 A", "10 A"], "j": "Tiene que quedar entre 24,7 A y 31 A: el de 25 A. Y además es mayor que el más grande de las líneas de abajo (16 A).", "img": "fig21.png", "cap": "Un cuadro con tres motores. Cada línea roja del dibujo son tres cables (L1, L2 y L3). Las letras marcan dónde se pone la pinza.", "cat": ["calibre", "esquemas", "general"]}, {"n": 48, "ans": "b", "tema": "T6", "t": "T6 · 6.11 (ejemplo)", "dif": "M", "tipo": "CAL", "q": "Si la línea general llevara un cable de 6 mm² (aguanta 40 A), ¿qué calibres valdrían para -Q0?", "ok": "25 A, 32 A y 40 A", "d": ["Solo el de 25 A", "Solo el de 40 A", "20 A y 25 A"], "j": "Vale cualquiera que quede entre los 24,7 A que pide la línea y los 40 A que aguanta el cable. Los tres son mayores que el más grande de abajo (16 A).", "img": "fig21.png", "cap": "Un cuadro con tres motores. Cada línea roja del dibujo son tres cables (L1, L2 y L3). Las letras marcan dónde se pone la pinza.", "cat": ["cable", "calibre", "general", "regla"]}, {"n": 49, "ans": "d", "tema": "T6", "t": "T6 · 6.11 (¿por qué?)", "dif": "D", "tipo": "TEO", "q": "Imagina que -Q0 fuera de 16 A, igual que -Q2, y hubiera un cortocircuito en -M2. ¿Qué podría pasar?", "ok": "Que salte la general y se pare todo", "d": ["Que no salte ninguno de los magnetotérmicos", "Que salte solo -Q1", "Que salte solo -Q3"], "j": "Con el mismo calibre podrían saltar los dos, o solo la general. Por eso los calibres van de mayor a menor hacia abajo: selectividad.", "img": "fig21.png", "cap": "Un cuadro con tres motores. Cada línea roja del dibujo son tres cables (L1, L2 y L3). Las letras marcan dónde se pone la pinza.", "cat": ["esquemas", "general", "magneto"]}, {"n": 50, "ans": "c", "tema": "T6", "t": "T6 · 6.2 / 6.11 (animación 6.11)", "dif": "M", "tipo": "PIN", "q": "Quieres saber cuánta corriente pide solo -M2. ¿Dónde pones la pinza amperimétrica?", "ok": "En Ⓒ, abrazando una sola fase", "d": ["En Ⓐ, abrazando una sola fase", "En Ⓒ, abrazando las tres fases", "En Ⓑ, abrazando una sola fase"], "j": "Ⓒ es la línea de -M2, entre -Q2 y el motor. Ⓑ es la de -M1 y por Ⓐ pasa la corriente de los tres. Y la pinza abraza siempre un solo cable.", "img": "fig21.png", "cap": "Un cuadro con tres motores. Cada línea roja del dibujo son tres cables (L1, L2 y L3). Las letras marcan dónde se pone la pinza.", "cat": ["esquemas", "general", "pinza"]}, {"n": 51, "ans": "a", "tema": "T6", "t": "T6 · 6.11", "dif": "M", "tipo": "PIN", "q": "Los tres motores trabajan a plena carga. Pones la pinza (en A~) en una sola fase en Ⓐ. ¿Qué marca, más o menos?", "ok": "24,7 A", "d": ["14,8 A", "0 A", "74 A"], "j": "Ⓐ es la línea general, antes de -Q0. Por ahí pasa la suma de los tres motores: 6,4 + 14,8 + 3,5.", "img": "fig21.png", "cap": "Un cuadro con tres motores. Cada línea roja del dibujo son tres cables (L1, L2 y L3). Las letras marcan dónde se pone la pinza.", "cat": ["esquemas", "general", "pinza"]}, {"n": 52, "ans": "b", "tema": "T6", "t": "T6 · 6.11", "dif": "D", "tipo": "PIN", "q": "-M2 está parado y los otros dos trabajan a plena carga. Pinza (en A~) en una sola fase en Ⓐ. ¿Qué marca?", "ok": "9,9 A", "d": ["24,7 A", "14,8 A", "0 A"], "j": "Ⓐ es la línea general. Ahora solo pasa la corriente de -M1 y -M3: 6,4 + 3,5 = 9,9 A.", "img": "fig21.png", "cap": "Un cuadro con tres motores. Cada línea roja del dibujo son tres cables (L1, L2 y L3). Las letras marcan dónde se pone la pinza.", "cat": ["esquemas", "general", "pinza"]}, {"n": 53, "ans": "a", "tema": "T6", "t": "P5 · medidas (¿por qué?)", "dif": "M", "tipo": "PIN", "q": "Con los tres motores en marcha, abrazas con la pinza las tres fases a la vez en Ⓐ. ¿Qué marca?", "ok": "0 A", "d": ["24,7 A", "74,1 A (tres veces 24,7)", "La de la fase que más pide"], "j": "Ⓐ es la línea general: son tres cables. La pinza abraza un solo cable; con los tres dentro marca 0 A.", "img": "fig21.png", "cap": "Un cuadro con tres motores. Cada línea roja del dibujo son tres cables (L1, L2 y L3). Las letras marcan dónde se pone la pinza.", "cat": ["esquemas", "general", "pinza"]}, {"n": 54, "ans": "b", "tema": "T6", "t": "T6 · 6.7 (¡OJO!) y 6.8", "dif": "D", "tipo": "PIN", "q": "Pinza en Ⓑ: 8 A en las tres fases. La placa de -M1 dice 6,4 A. Si sigue así, ¿qué aparato salta?", "ok": "El relé térmico de -M1", "d": ["-Q1, porque 8 A es más que 6,4 A", "-Q0, el general", "Ninguno: 8 A es menos que 10 A"], "j": "Ⓑ es la línea de -M1. El motor está sobrecargado. -Q1 es de 10 A y ni se entera: el que vigila al motor es su térmico, con la ruleta en 6,4 A.", "img": "fig21.png", "cap": "Un cuadro con tres motores. Cada línea roja del dibujo son tres cables (L1, L2 y L3). Las letras marcan dónde se pone la pinza.", "cat": ["averias", "esquemas", "pinza", "termico"]}, {"n": 55, "ans": "c", "tema": "T6", "t": "T6 · 6.2 (la corriente es la misma en las tres fases)", "dif": "D", "tipo": "PIN", "q": "-M3 trabaja a plena carga. Pones la pinza en una fase en Ⓓ y después en otra fase del mismo sitio. ¿Qué lees?", "ok": "Unos 3,5 A en las dos", "d": ["3,5 A en una y 0 A en la otra", "Unos 1,2 A en cada una (3,5 entre 3)", "7 A en la segunda"], "j": "Ⓓ es la línea de -M3. La corriente de la placa es la que pasa por cada una de las tres fases: no se reparte entre ellas.", "img": "fig21.png", "cap": "Un cuadro con tres motores. Cada línea roja del dibujo son tres cables (L1, L2 y L3). Las letras marcan dónde se pone la pinza.", "cat": ["esquemas", "pinza", "placa"]}, {"n": 56, "ans": "d", "tema": "T6", "t": "T6 · 6.2", "dif": "M", "tipo": "PIN", "q": "Un motor de 6,4 A trabaja a plena carga. Con la pinza lees 6,4 A, 6,3 A y 6,5 A en las tres fases. ¿Cómo está?", "ok": "Bien: es simétrico", "d": ["Le falta una fase", "Está sobrecargado", "Tiene un bobinado dañado"], "j": "En un motor sano las tres fases llevan más o menos la misma corriente. Hay problema si una se diferencia más de un 10 %.", "img": null, "cap": "", "cat": ["pinza", "placa"]}, {"n": 57, "ans": "b", "tema": "T6", "t": "T6 · 6.2 (en el taller)", "dif": "M", "tipo": "PIN", "q": "En ese motor de 6,4 A, otro día la pinza marca 0 A, 11 A y 11 A. ¿Qué pasa?", "ok": "Falta una fase", "d": ["El motor está parado", "El consumo es simétrico", "La pinza está en V~"], "j": "Una fase a 0 A y las otras dos más altas: falta una fase. El motor zumba, se calienta y acaba saltando el térmico.", "img": null, "cap": "", "cat": ["averias", "pinza"]}, {"n": 58, "ans": "d", "tema": "T6", "t": "T6 · 6.2 (en el taller)", "dif": "M", "tipo": "AVE", "q": "Si falta una fase, ¿cuál puede ser la causa?", "ok": "Un tornillo suelto o un fusible fundido en esa fase", "d": ["La ruleta del térmico demasiado alta", "Un magnetotérmico de curva B", "Un cable de demasiada sección"], "j": "También puede ser un contacto del contactor quemado. Todo lo que corta el camino de esa fase.", "img": null, "cap": "", "cat": ["averias", "pinza"]}, {"n": 59, "ans": "c", "tema": "T6", "t": "T6 · 6.2 (en el taller)", "dif": "D", "tipo": "AVE", "q": "Con la pinza ves que una fase lleva bastante más corriente que las otras dos. ¿Qué mides primero?", "ok": "La tensión entre fases, con el polímetro en V~", "d": ["La continuidad de la bobina, sin tensión", "La corriente del cable de la bobina", "La resistencia del cable, con tensión"], "j": "Se mide L1-L2, L2-L3 y L1-L3. Si las tres tensiones son iguales, la red está bien y el fallo está aguas abajo.", "img": null, "cap": "", "cat": ["averias", "pinza", "tension"]}, {"n": 60, "ans": "a", "tema": "T6", "t": "T6 · 6.2 (en el taller)", "dif": "D", "tipo": "AVE", "q": "Las tres tensiones entre fases son iguales, pero una corriente es distinta de las otras. ¿Dónde está el fallo?", "ok": "Aguas abajo: tornillo flojo, contacto gastado o bobinado dañado", "d": ["En la red: falta tensión en una fase", "En el circuito de mando", "En el magnetotérmico general, que es pequeño"], "j": "La red está bien. Para comprobar el motor: sin tensión, con el polímetro en ohmios, los tres bobinados tienen que dar lo mismo.", "img": null, "cap": "", "cat": ["averias", "pinza", "tension"]}, {"n": 61, "ans": "b", "tema": "T6", "t": "Ejercicio 20 a", "dif": "D", "tipo": "PIN", "q": "Motor con 11 A en la placa y el térmico con la ruleta en 11 A, que salta a menudo. Con la pinza lees 13,5 A, 13,6 A y 13,4 A. ¿Qué pasa?", "ok": "El motor está sobrecargado", "d": ["Falta una fase", "El térmico está estropeado", "El consumo no es simétrico"], "j": "Las tres corrientes son iguales (simétricas), pero más altas que la de la placa. El térmico hace bien su trabajo.", "img": null, "cap": "", "cat": ["averias", "pinza", "termico"]}, {"n": 62, "ans": "d", "tema": "T6", "t": "Ejercicio 20 b", "dif": "M", "tipo": "SEG", "q": "En ese caso, un compañero propone subir la ruleta a 13 A para que deje de saltar. ¿Qué le dices?", "ok": "No: el motor se puede quemar", "d": ["Sí: así ya no molesta", "Sí, pero cambiando también el cable", "No: hay que bajarla a 9 A"], "j": "La ruleta va en la corriente de la placa. Hay que buscar por qué el motor pide de más (o poner un motor más grande).", "img": null, "cap": "", "cat": ["seguridad", "termico"]}, {"n": 63, "ans": "a", "tema": "T4", "t": "P3 · medida 8 / P5 · medidas 9 y 10", "dif": "M", "tipo": "PIN", "q": "Quieres medir la corriente que pide el motor en marcha. ¿Dónde pones la pinza amperimétrica?", "ok": "Abrazando solo el cable que sale de Ⓖ", "d": ["Abrazando los tres cables del motor", "Abrazando el cable que llega a Ⓚ", "Con una punta en Ⓖ y otra en Ⓗ"], "j": "Ⓖ es el 2/T1 de -F2: de ahí sale el cable de una fase hacia -X1:1 y el motor. Un solo cable. Ⓚ es el A1 de la bobina (mando). Ⓗ es otro tornillo de -F2, pero la pinza no tiene puntas.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha). Las letras marcan los puntos de medida.", "cat": ["arranque", "esquemas", "motor", "pinza"]}, {"n": 64, "ans": "c", "tema": "T4", "t": "T4 · 4.1 / T6 · 6.2", "dif": "M", "tipo": "PIN", "q": "Motor en marcha. La pinza (en A~) marca 5,2 A en el cable que llega a Ⓒ. ¿Qué marcará en el cable que sale de Ⓖ?", "ok": "Lo mismo: 5,2 A", "d": ["Menos: el térmico se queda una parte", "0 A", "El triple: 15,6 A"], "j": "Ⓒ es el 1/L1 de -KM1 y Ⓖ, el 2/T1 de -F2: es la misma fase (L1), todo en serie. La corriente es la misma en todo el camino.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha). Las letras marcan los puntos de medida.", "cat": ["arranque", "esquemas", "motor", "pinza"]}, {"n": 65, "ans": "d", "tema": "T4", "t": "T6 · 6.2 (la corriente es la misma en las tres fases)", "dif": "M", "tipo": "PIN", "q": "Motor en marcha. La pinza marca 5,2 A en el cable que llega a Ⓒ. ¿Y en el cable que llega a Ⓓ?", "ok": "Más o menos lo mismo", "d": ["0 A: por L3 no pasa corriente", "La mitad", "El doble"], "j": "Ⓒ y Ⓓ son el 1/L1 y el 5/L3 de -KM1: dos fases distintas. En un motor sano las tres fases llevan la misma corriente.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha). Las letras marcan los puntos de medida.", "cat": ["arranque", "esquemas", "motor", "pinza"]}, {"n": 66, "ans": "b", "tema": "T4", "t": "T4 · 4.1", "dif": "D", "tipo": "PIN", "q": "-Q1 subido y -KM1 en reposo. Pinza (en A~) en el cable que sale de Ⓐ. ¿Qué marca?", "ok": "0 A: no pasa corriente", "d": ["230 A", "La corriente de la placa del motor", "Unas centésimas, por la bobina"], "j": "Ⓐ es el 2 de -Q1. Con -KM1 abierto el motor está parado: no pasa corriente. La pinza mide corriente, no tensión.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha). Las letras marcan los puntos de medida.", "cat": ["arranque", "contactor", "esquemas", "pinza"]}, {"n": 67, "ans": "c", "tema": "T4", "t": "P3 · medida 8", "dif": "M", "tipo": "PIN", "q": "¿En qué posición se pone la pinza amperimétrica para medir lo que pide el motor?", "ok": "A~ (amperios de alterna)", "d": ["V~ (voltios de alterna)", "Ω (ohmios)", "Continuidad (el pitido)"], "j": "La pinza mide la corriente que pasa por el cable que abraza: amperios de alterna.", "img": null, "cap": "", "cat": ["motor", "pinza"]}, {"n": 68, "ans": "a", "tema": "T4", "t": "P3 · medida 8", "dif": "M", "tipo": "PIN", "q": "Para medir con la pinza la corriente del motor, ¿hay que soltar algún cable?", "ok": "No: se abraza el cable con el motor en marcha", "d": ["Sí: se pone en serie con el motor, como un amperímetro", "Sí, y se mide sin tensión", "No: se tocan dos tornillos con las puntas"], "j": "Es la ventaja de la pinza: mide desde fuera del cable, sin desconectar nada. Sin corriente (motor parado) marcaría 0 A.", "img": null, "cap": "", "cat": ["motor", "pinza"]}, {"n": 69, "ans": "d", "tema": "T4", "t": "T4 · 4.4", "dif": "D", "tipo": "PIN", "q": "Con el motor en marcha salta el térmico -F2. Después pones la pinza en el cable que sale de Ⓖ. ¿Qué marca?", "ok": "0 A: -KM1 ha caído", "d": ["La corriente de la placa", "Más que antes de saltar", "Unas centésimas de amperio"], "j": "Ⓖ es el 2/T1 de -F2. Al saltar se abre el 95-96, la bobina pierde la tensión y -KM1 abre la fuerza: el motor se para.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha). Las letras marcan los puntos de medida.", "cat": ["arranque", "esquemas", "pinza", "termico"]}, {"n": 70, "ans": "c", "tema": "T4", "t": "T6 · 6.8", "dif": "D", "tipo": "PIN", "q": "La placa del motor dice 5,2 A. Pones la pinza en el cable que sale de Ⓖ y después en el que sale de Ⓗ: 6,5 A en los dos. ¿Qué pasa?", "ok": "El motor está sobrecargado", "d": ["Falta una fase", "Todo normal", "Hay un cortocircuito"], "j": "Ⓖ y Ⓗ son el 2/T1 y el 6/T3 de -F2. Las corrientes son iguales, pero un 25 % más altas que la de la placa. Si sigue así, saltará -F2.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha). Las letras marcan los puntos de medida.", "cat": ["arranque", "averias", "esquemas", "pinza", "termico"]}, {"n": 71, "ans": "b", "tema": "T4", "t": "T6 · 6.2 (en el taller)", "dif": "D", "tipo": "PIN", "q": "El motor zumba. Pinza: 9 A en el cable que sale de Ⓖ, 9 A en el del medio y 0 A en el que sale de Ⓗ. ¿Qué pasa?", "ok": "Falta la fase L3", "d": ["Falta la fase L1", "Está sobrecargado, sin más", "Ha saltado el térmico"], "j": "Ⓖ y Ⓗ son el 2/T1 y el 6/T3 de -F2: las fases L1 y L3. Una fase a 0 A y las otras dos altas: trabaja a dos fases. Busca un tornillo suelto o un contacto quemado en L3.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha). Las letras marcan los puntos de medida.", "cat": ["arranque", "averias", "esquemas", "pinza"]}, {"n": 72, "ans": "a", "tema": "T4", "t": "T6 · 6.8 (en el taller)", "dif": "M", "tipo": "APA", "q": "Quieres saber si la ruleta de -F2 está bien puesta. ¿Con qué la comparas?", "ok": "Con la corriente de la placa del motor", "d": ["Con el calibre de -Q1", "Con lo que aguanta el cable", "Con el pico de arranque"], "j": "El térmico se elige por el motor: la ruleta va en la corriente de la placa (la caja Y o Δ, según cómo se conecte).", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha). Las letras marcan los puntos de medida.", "cat": ["arranque", "esquemas", "placa", "termico"]}, {"n": 73, "ans": "c", "tema": "T5", "t": "T5 · 5.2 (practica)", "dif": "M", "tipo": "CRO", "q": "Los tres contactos son de aparatos alimentados con la misma bobina. ¿Cuál es el de un temporizador a la conexión?", "ok": "El C", "d": ["El A", "El B", "Ninguno de los tres"], "j": "Tarda en entrar: con la segunda pulsación (del 8 al 12) cambia en el 11, 3 s después. Con la primera no le da tiempo.", "img": "fig24.png", "cap": "Cronograma de tres contactos. T = 3 s.", "cat": ["crono", "tempo"]}, {"n": 74, "ans": "a", "tema": "T5", "t": "T5 · 5.2 (practica)", "dif": "M", "tipo": "CRO", "q": "¿Cuál es el contacto de un temporizador a la desconexión?", "ok": "El A", "d": ["El B", "El C", "El B y el C"], "j": "Entra al momento y tarda 3 s en salir: vuelve a reposo en el 6 (3 + 3) y en el 15 (12 + 3).", "img": "fig24.png", "cap": "Cronograma de tres contactos. T = 3 s.", "cat": ["crono", "tempo"]}, {"n": 75, "ans": "b", "tema": "T5", "t": "T5 · 5.2 (practica)", "dif": "D", "tipo": "CRO", "q": "En el contacto C, ¿por qué no cambia nada con la primera pulsación?", "ok": "Porque dura 2 s, menos que T", "d": ["Porque el temporizador está roto", "Porque es a la desconexión", "Porque falta la realimentación"], "j": "A la conexión: si quitas la tensión antes de T (3 s), los contactos no llegan a cambiar y el tiempo contado se pierde.", "img": "fig24.png", "cap": "Cronograma de tres contactos. T = 3 s.", "cat": ["crono", "tempo"]}, {"n": 76, "ans": "d", "tema": "T5", "t": "T5 · 5.2 (practica)", "dif": "D", "tipo": "CRO", "q": "En el contacto A, ¿en qué segundo vuelve a reposo después de la primera pulsación?", "ok": "En el 6", "d": ["En el 3", "En el 4", "En el 9"], "j": "La bobina pierde la tensión en el 3. A la desconexión, el tiempo empieza a contar ahí: 3 + 3 = 6.", "img": "fig24.png", "cap": "Cronograma de tres contactos. T = 3 s.", "cat": ["crono", "tempo"]}, {"n": 77, "ans": "a", "tema": "T5", "t": "T5 · 5.2 (idea clave)", "dif": "M", "tipo": "CRO", "q": "Das pulsaciones cortas seguidas (más cortas que T) a un temporizador a la conexión. ¿Qué hacen sus contactos?", "ok": "No llegan a cambiar nunca", "d": ["Cambian y ya no vuelven", "Cambian con cada pulsación", "Cambian T segundos después de la última"], "j": "A la conexión: con pulsaciones cortas nunca llega a actuar. A la desconexión: con pulsaciones cortas seguidas nunca llega a parar.", "img": null, "cap": "", "cat": ["crono", "tempo"]}, {"n": 78, "ans": "b", "tema": "T5", "t": "T5 · 5.2", "dif": "M", "tipo": "CRO", "q": "En un temporizador a la desconexión, ¿cuándo empieza a contar el tiempo?", "ok": "Al quitar la tensión a la bobina", "d": ["Al dar tensión a la bobina", "Al cerrarse el 67-68", "Al girar la ruleta"], "j": "Al dar tensión, los contactos cambian al momento. El tiempo empieza al soltar, no al pulsar.", "img": null, "cap": "", "cat": ["crono", "tempo"]}, {"n": 79, "ans": "c", "tema": "T5", "t": "T5 · 5.3 (el truco del paraguas)", "dif": "M", "tipo": "SIM", "q": "Un contacto 67-68 lleva el paraguas con forma de «(». ¿De qué aparato es?", "ok": "De un temporizador a la conexión", "d": ["De un temporizador a la desconexión", "De un contactor normal", "De un relé térmico"], "j": "El paraguas con forma de C es la C de Conexión. En el de desconexión está al revés. Sin paraguas, el contacto es instantáneo.", "img": "fig25.png", "cap": "Símbolos de los temporizadores y de un contactor normal.", "cat": ["esquemas", "tempo"]}, {"n": 80, "ans": "d", "tema": "T5", "t": "T5 · 5.3", "dif": "M", "tipo": "SIM", "q": "En el aula, ¿qué números llevan los contactos temporizados?", "ok": "55-56 el NC y 67-68 el NA", "d": ["55-56 el NA y 67-68 el NC", "95-96 el NC y 97-98 el NA", "53-54 el NA y 61-62 el NC"], "j": "Los dos bloques (conexión y desconexión) usan los mismos números. Ojo: no confundas el 55-56 con el 95-96 del térmico.", "img": "fig25.png", "cap": "Símbolos de los temporizadores y de un contactor normal.", "cat": ["esquemas", "tempo"]}, {"n": 81, "ans": "b", "tema": "T5", "t": "T5 · 5.6 / P5 · medidas 1 a 3", "dif": "D", "tipo": "MED", "q": "Bloque a la conexión con la ruleta en 5 s. Sin tensión y con el polímetro en continuidad (el pitido) en el 67-68, aprietas el contactor a mano. ¿Qué pasa los primeros segundos?", "ok": "Marca OL: aún no ha cambiado", "d": ["Pita al momento", "Pita y deja de pitar a los 5 s", "Marca 230 V"], "j": "El 67-68 es NA y a la conexión tarda en cerrarse. Pasados los 5 s, pita.", "img": null, "cap": "", "cat": ["continuidad", "tempo"]}, {"n": 82, "ans": "d", "tema": "T5", "t": "T5 · 5.6", "dif": "D", "tipo": "MED", "q": "Bloque a la desconexión. Sin tensión y con el polímetro en continuidad en el 67-68, llevas un rato apretando el contactor y lo sueltas. ¿Qué pasa los primeros segundos?", "ok": "Sigue pitando: aún no ha vuelto", "d": ["Marca OL al momento", "No pita nunca: es un NC", "Marca OL y pita pasado T"], "j": "A la desconexión, el contacto se cierra al momento y tarda T en volver a reposo después de soltar.", "img": null, "cap": "", "cat": ["continuidad", "tempo"]}, {"n": 83, "ans": "c", "tema": "T5", "t": "T5 · 5.6 (¿por qué?)", "dif": "D", "tipo": "MAL", "q": "Arranque escalonado de dos motores. Por error usas el 13-14 de -KT1, en vez del 67-68, para dar paso a -KM2. ¿Qué pasa?", "ok": "Los dos motores arrancan a la vez", "d": ["-M2 no arranca nunca", "-M2 arranca al momento y -M1 se para", "Salta -Q1 al pulsar la marcha"], "j": "El 13-14 es instantáneo: cambia al momento. El que espera es el 67-68. En el aparato parecen iguales: mira siempre el número.", "img": null, "cap": "", "cat": ["contactor", "tempo"]}, {"n": 84, "ans": "a", "tema": "T5", "t": "P5 · 5.1 (cuestión 3)", "dif": "D", "tipo": "PULSA", "q": "Arranque escalonado con -KT1 a la conexión en 5 s. Pulsas la marcha -S2 y, a los 3 s, el paro -S1. ¿Llega a arrancar -M2?", "ok": "No: -KT1 pierde la tensión antes de tiempo", "d": ["Sí, 2 s después", "Sí, al momento", "Sí, 5 s después del paro"], "j": "El paro suelta -KM1 y -KT1. El tiempo contado se pierde: la próxima vez empieza de cero.", "img": null, "cap": "", "cat": ["pulsadores", "tempo"]}, {"n": 85, "ans": "b", "tema": "T5", "t": "P5 · medidas 9 y 10", "dif": "D", "tipo": "PIN", "q": "El motor gira a derechas (-KM1 activado). Abrazas con la pinza (en A~) solo el cable que sale de Ⓕ. ¿Qué marca?", "ok": "0 A: -KM2 está abierto", "d": ["Lo mismo que pide el motor", "La mitad de lo que pide el motor", "Unas centésimas, como la bobina"], "j": "Ⓕ es el 2/T1 de -KM2. Sus contactos principales están abiertos: por sus cables no pasa corriente, aunque el motor gire.", "img": "fig10.png", "cap": "Fuerza de la inversión de giro. Las letras marcan los puntos de medida.", "cat": ["contactor", "esquemas", "inversion", "pinza"]}, {"n": 86, "ans": "d", "tema": "T5", "t": "T5 · 5.7", "dif": "M", "tipo": "PIN", "q": "Los dos contactores en reposo y -Q1 subido. Pinza (en A~) en el cable que sale de Ⓐ. ¿Qué marca?", "ok": "0 A", "d": ["230 A", "La corriente de la placa", "Unas centésimas de amperio"], "j": "Ⓐ es el 2 de -Q1. Hay tensión, pero con el motor parado no pasa corriente.", "img": "fig10.png", "cap": "Fuerza de la inversión de giro. Las letras marcan los puntos de medida.", "cat": ["esquemas", "inversion", "pinza"]}, {"n": 87, "ans": "c", "tema": "T5", "t": "T5 · 5.7 y 5.9", "dif": "D", "tipo": "PIN", "q": "¿Dónde pones la pinza para medir lo que pide el motor, gire hacia donde gire?", "ok": "En un solo cable entre -F1 y el motor (por ejemplo, el de -X1:1)", "d": ["En el cable que llega a Ⓓ", "En el cable que sale de Ⓕ", "Abrazando los tres cables del motor"], "j": "Por -F1 y por el bornero pasa la corriente en los dos sentidos. Ⓓ y Ⓕ son el 1/L1 y el 2/T1 de -KM2: por ahí solo pasa girando a izquierdas.", "img": "fig10.png", "cap": "Fuerza de la inversión de giro. Las letras marcan los puntos de medida.", "cat": ["esquemas", "inversion", "pinza"]}, {"n": 88, "ans": "a", "tema": "T5", "t": "P5 · medidas 9 y 10", "dif": "M", "tipo": "PIN", "q": "Girando a derechas, la pinza en el cable de -X1:1 marca 5,2 A. ¿Qué marcará girando a izquierdas con la misma carga?", "ok": "Lo mismo: 5,2 A", "d": ["0 A: por ese cable ya no pasa", "−5,2 A", "El doble"], "j": "El motor pide la misma corriente gire hacia donde gire. La pinza no dice el sentido de giro.", "img": "fig10.png", "cap": "Fuerza de la inversión de giro. Las letras marcan los puntos de medida.", "cat": ["esquemas", "inversion", "pinza"]}, {"n": 89, "ans": "d", "tema": "T5", "t": "P5 · medidas 6 y 7 (¿por qué?)", "dif": "D", "tipo": "MED", "q": "Polímetro en tensión alterna (V~) entre U1 y V1 del motor. Girando a derechas lees 230 V. ¿Y girando a izquierdas?", "ok": "También 230 V", "d": ["0 V", "−230 V", "400 V"], "j": "El polímetro mide cuánta tensión hay entre dos hilos, no en qué orden llegan las fases. El sentido de giro solo se ve en el motor.", "img": "fig10.png", "cap": "Fuerza de la inversión de giro. Las letras marcan los puntos de medida.", "cat": ["esquemas", "inversion", "tension"]}, {"n": 90, "ans": "c", "tema": "T5", "t": "T5 · 5.8", "dif": "M", "tipo": "SIM", "q": "¿Qué contacto impide que entre -KM2 cuando -KM1 está activado?", "ok": "El 61-62 de -KM1", "d": ["El 13-14 de -KM1", "El 53-54 de -KM2", "El 61-62 de -KM2"], "j": "Enclavamiento: el 61-62 de cada contactor va en serie con la bobina del otro.", "img": "fig22.png", "cap": "Mando de la inversión de giro. Las letras marcan los puntos de medida.", "cat": ["contactor", "enclav", "esquemas", "inversion"]}, {"n": 91, "ans": "a", "tema": "T5", "t": "T5 · 5.8", "dif": "M", "tipo": "MED", "q": "-KM1 está activado y mantienes pulsado -S3. Polímetro en tensión alterna (V~): negra en N y roja en Ⓒ. ¿Qué lees?", "ok": "230 V", "d": ["0 V", "115 V", "OL"], "j": "Ⓒ es el 61 del contacto de -KM1 que está en la rama de -KM2. Con -S3 pulsado, la fase llega hasta ahí.", "img": "fig22.png", "cap": "Mando de la inversión de giro. Las letras marcan los puntos de medida.", "cat": ["enclav", "esquemas", "inversion", "tension"]}, {"n": 92, "ans": "b", "tema": "T5", "t": "T5 · 5.8", "dif": "D", "tipo": "MED", "q": "En la misma situación (-KM1 activado y -S3 pulsado), pones la negra en N y la roja en Ⓓ. ¿Qué lees?", "ok": "0 V: el 61-62 de -KM1 está abierto", "d": ["230 V: -S3 está pulsado", "230 V: es el tornillo de la bobina", "115 V: la mitad"], "j": "Ⓓ es el A1 de -KM2. La fase llega al 61 pero no pasa del contacto abierto: por eso -KM2 no puede entrar.", "img": "fig22.png", "cap": "Mando de la inversión de giro. Las letras marcan los puntos de medida.", "cat": ["enclav", "esquemas", "inversion", "tension"]}, {"n": 93, "ans": "d", "tema": "T5", "t": "T5 · 5.8 / T2 · 2.9", "dif": "D", "tipo": "MED", "q": "Sin tensión (-Q2 bajado) y con el polímetro en continuidad entre Ⓒ y Ⓓ, pita. Empujas el testigo de -KM1. ¿Qué pasa?", "ok": "Deja de pitar y marca OL", "d": ["Sigue pitando igual", "Pita más fuerte", "Marca 230 V"], "j": "Ⓒ y Ⓓ son el 61 de -KM1 y el A1 de -KM2: entre ellos está el 61-62 (NC). Al activar -KM1, se abre.", "img": "fig22.png", "cap": "Mando de la inversión de giro. Las letras marcan los puntos de medida.", "cat": ["continuidad", "enclav", "esquemas", "inversion"]}, {"n": 94, "ans": "b", "tema": "T5", "t": "T5 · 5.8", "dif": "M", "tipo": "PULSA", "q": "El motor gira a derechas y pulsas -S3 sin pasar por el paro. ¿Qué pasa?", "ok": "Nada: sigue girando a derechas", "d": ["Cambia de sentido", "Se para", "Hay un cortocircuito y salta -Q1"], "j": "El 61-62 de -KM1 está abierto y no deja entrar a -KM2. Para cambiar de sentido hay que pasar por paro.", "img": "fig22.png", "cap": "Mando de la inversión de giro. Las letras marcan los puntos de medida.", "cat": ["enclav", "esquemas", "inversion", "pulsadores"]}, {"n": 95, "ans": "a", "tema": "T5", "t": "T5 · 5.8", "dif": "D", "tipo": "AVE", "q": "Pulsas -S2 y -KM1 no entra. Con -S2 pulsado y el polímetro en V~ (negra en N), lees 230 V en Ⓐ y 0 V en Ⓑ. ¿Dónde está el fallo?", "ok": "En el 61-62 de -KM2 (o en sus cables)", "d": ["En la bobina de -KM1", "En el pulsador -S2", "En el térmico -F1"], "j": "Ⓐ es el 61 de -KM2 y Ⓑ, el A1 de -KM1. La fase llega al 61 y no sale por el 62: ese contacto NC no está cerrando.", "img": "fig22.png", "cap": "Mando de la inversión de giro. Las letras marcan los puntos de medida.", "cat": ["averias", "enclav", "esquemas", "inversion", "tension"]}, {"n": 96, "ans": "c", "tema": "T5", "t": "T5 · 5.10", "dif": "M", "tipo": "SIM", "q": "¿Por qué contactos pasa la bobina de -KT1?", "ok": "Por los 71-72 de -KM1 y de -KM2", "d": ["Por los 61-62 de -KM1 y de -KM2", "Por los 13-14 de -KM1 y de -KM2", "Por su propio 67-68"], "j": "Así -KT1 solo tiene tensión con el motor parado, y cuenta la pausa.", "img": "fig23.png", "cap": "Inversión de giro con pausa: -KT1 es un temporizador a la conexión.", "cat": ["esquemas", "inversion", "tempo"]}, {"n": 97, "ans": "b", "tema": "T5", "t": "T5 · 5.10", "dif": "D", "tipo": "PULSA", "q": "El motor giraba a derechas. Pulsas el paro -S1 y, enseguida, -S3. ¿Qué pasa?", "ok": "No arranca: hay que esperar", "d": ["Arranca a izquierdas al momento", "Arranca a derechas", "Salta -Q1"], "j": "Las dos marchas pasan por el 67-68 de -KT1, que no se cierra hasta T segundos después de pararse el motor.", "img": "fig23.png", "cap": "Inversión de giro con pausa: -KT1 es un temporizador a la conexión.", "cat": ["esquemas", "inversion", "pulsadores", "tempo"]}, {"n": 98, "ans": "c", "tema": "T5", "t": "T5 · 5.10 / P5 · 5.3 (cuestión 3)", "dif": "D", "tipo": "SIM", "q": "Mientras el motor gira, -KT1 pierde la tensión y su 67-68 se abre. ¿Por qué no se para el motor?", "ok": "Porque los 13-14 no pasan por el 67-68", "d": ["Porque el 67-68 es a la desconexión", "Porque -KT1 sigue con tensión", "Porque el 61-62 hace de realimentación"], "j": "Las realimentaciones 13-14 se cogen antes del 67-68: mientras gira, -KT1 cae y el motor sigue.", "img": "fig23.png", "cap": "Inversión de giro con pausa: -KT1 es un temporizador a la conexión.", "cat": ["esquemas", "inversion", "realim", "tempo"]}, {"n": 99, "ans": "a", "tema": "T5", "t": "T5 · 5.10 (ejemplo del vaivén)", "dif": "M", "tipo": "PULSA", "q": "Vaivén de un carro: el NC 1-2 de -FC2 va en serie en la rama de -KM1 (derechas). ¿Qué pasa cuando el carro llega a -FC2?", "ok": "-KM1 cae y el carro se para", "d": ["Cambia de sentido al momento", "Salta el térmico", "Nada: el 1-2 es NA"], "j": "El NC se abre y corta la bobina de -KM1. Pasada la pausa, el NA 3-4 de -FC2 lo hace salir hacia la izquierda.", "img": null, "cap": "", "cat": ["fc", "inversion"]}, {"n": 100, "ans": "d", "tema": "T5", "t": "T5 · 5.11", "dif": "M", "tipo": "SIM", "q": "En un esquema lees «-W1 4G1,5». ¿Qué es?", "ok": "Una manguera de 4 hilos de 1,5 mm², uno verde-amarillo", "d": ["Una manguera de 4 hilos de 1,5 mm², sin verde-amarillo", "Un bornero de 4 bornes", "Un cable de 4 mm² y 1,5 m"], "j": "-W es una manguera. La G quiere decir que uno de los hilos es el verde-amarillo. Con × (5×1) no lo lleva.", "img": null, "cap": "", "cat": ["bornero"]}];
