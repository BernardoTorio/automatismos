<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test de repaso · Automatismos 1MB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f1; --card:#ffffff; --ink:#1d2320; --muted:#5d6862; --line:#d9e0d4;
  --green:#4e8a1e; --green-soft:#e6f2da; --red:#c0392b; --red-soft:#fbe4e1;
  --ok:#2e7d32; --ok-soft:#e3f3e4; --yellow:#b7860b; --yellow-soft:#fdf5dc;
  --blue:#1f5fbf; --btn:#eef2ea; --on-green:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#141816; --card:#1e2420; --ink:#e7ece8; --muted:#a3ada6; --line:#34403a;
  --green:#8bc34a; --green-soft:#24331b; --red:#ef6b5d; --red-soft:#3a201d;
  --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
  --blue:#7aa7f0; --btn:#262e29; --on-green:#10200a; --shadow:0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --card:#1e2420; --ink:#e7ece8; --muted:#a3ada6; --line:#34403a;
    --green:#8bc34a; --green-soft:#24331b; --red:#ef6b5d; --red-soft:#3a201d;
    --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
    --blue:#7aa7f0; --btn:#262e29; --on-green:#10200a; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.45}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--green);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.back{border:1px solid var(--line);background:var(--btn);color:var(--ink);padding:6px 12px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--green)}
.crumbs{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--green);text-decoration:none}
.crumbs b{color:var(--ink)}
.theme{border:1px solid var(--line);background:var(--btn);color:var(--ink);width:38px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:6px 0 2px;font-weight:700}
h1 span{color:var(--green)}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.box{border-left:5px solid var(--green);background:var(--green-soft);border-radius:8px;padding:10px 14px;margin:12px 0}
.box .lbl{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--green);display:block;margin-bottom:2px}
.box.why{border-color:var(--yellow);background:var(--yellow-soft)}
.box.why .lbl{color:var(--yellow)}
fieldset{border:none;padding:0;margin:0 0 14px}
legend{font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip>span{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--btn);cursor:pointer;font-size:15px;user-select:none}
.chip input:checked+span{border-color:var(--green);background:var(--green-soft);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.cnt{color:var(--muted);font-size:13px}
.go{background:var(--green);color:var(--on-green);border:none;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.ghost{background:var(--btn);color:var(--ink);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--btn)}
.tag.d{border-color:var(--red);color:var(--red)}
.score{margin-left:auto;font-weight:700;color:var(--ink)}
.qtext{font-size:19px;font-weight:700;margin:6px 0 12px}
figure{margin:0 0 12px;text-align:center}
figure img{max-width:100%;max-height:520px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line);cursor:zoom-in}
figcaption{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.verdict{font-weight:700;font-size:18px;margin-top:12px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--red)}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.big{font-size:44px;font-weight:700;color:var(--green);margin:0}
.review{border-top:1px solid var(--line);padding:12px 0}
.review .rq{font-weight:700}
.review .ra{color:var(--ok);font-weight:700}
.review .ry{color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px;padding:8px}
@media (max-width:560px){body{font-size:16px}.qtext{font-size:17px}h1{font-size:22px}.crumbs{font-size:12px}}
</style>
</head>

<script>
const DATA = [{"tema": "T1", "t": "T1 · Parte 2, §8", "dif": "M", "tipo": "MAL", "q": "En el trozo A, ¿qué criterio de dibujo no se cumple?", "ok": "-S1 está girado: no se sabe por dónde entra ni por dónde sale el cable", "d": ["Los números 3 y 4 de -S1 tendrían que ir a la izquierda", "-S1 tendría que ser un contacto NC", "El nombre -S1 tendría que ir a la derecha"], "j": "Cada símbolo se dibuja sobre su cable, centrado y sin girar; si está girado no está conectado a nada.", "img": "fig01.png", "cap": "Cinco trozos de esquema de mando dibujados por alumnos (A a E)."}, {"tema": "T1", "t": "T1 · Parte 2, §6", "dif": "M", "tipo": "MAL", "q": "En el trozo B, ¿qué está mal?", "ok": "Los números 3 y 4 de -S1 están a la izquierda del hilo", "d": ["El nombre -S1 tendría que ir a la derecha del símbolo", "El 3 tendría que ir abajo y el 4 arriba", "-S1 tendría que dibujarse pulsado"], "j": "Los números van pegados al símbolo y a la derecha del hilo; el nombre, a la izquierda.", "img": "fig01.png", "cap": "Cinco trozos de esquema de mando dibujados por alumnos (A a E)."}, {"tema": "T1", "t": "T1 · Parte 2, §2", "dif": "M", "tipo": "MAL", "q": "En el trozo C, ¿qué está mal?", "ok": "Hay un contacto entre el piloto y el neutro: X2 tiene que ir directo a N", "d": ["El 53-54 es NC y tendría que ser NA", "El piloto tendría que ir arriba del todo, pegado a la L", "Falta un pulsador de paro delante del piloto"], "j": "Entre la bobina o el piloto y el neutro nunca va un contacto: los consumos van abajo, pegados al N.", "img": "fig01.png", "cap": "Cinco trozos de esquema de mando dibujados por alumnos (A a E)."}, {"tema": "T1", "t": "T1 · Parte 2, §2", "dif": "M", "tipo": "MAL", "q": "En el trozo D, ¿qué está mal colocado?", "ok": "El 95-96 de -F2: va arriba del todo, antes del paro", "d": ["El 95-96 de -F2: va entre la bobina y el neutro", "-S0: va debajo de -S1", "-S1: va arriba del todo, antes de -S0"], "j": "Orden del mando: protecciones (95-96) → paros → marchas → bobina al neutro.", "img": "fig01.png", "cap": "Cinco trozos de esquema de mando dibujados por alumnos (A a E)."}, {"tema": "T1", "t": "T1 · Parte 2, §2-8", "dif": "D", "tipo": "MAL", "q": "¿Cuál de los cinco trozos cumple todos los criterios de dibujo?", "ok": "E", "d": ["D", "B", "C"], "j": "E tiene protecciones, paro, marcha y bobina en orden, símbolos rectos, nombres a la izquierda y números a la derecha.", "img": "fig01.png", "cap": "Cinco trozos de esquema de mando dibujados por alumnos (A a E)."}, {"tema": "T1", "t": "T1 · Parte 2, §3 / T4 · 4.3", "dif": "M", "tipo": "MAL", "q": "Un alumno dibuja los contactos principales de -KM1 cerrados «porque así están con el motor en marcha». ¿Qué le dices?", "ok": "Está mal: todo se dibuja en reposo, con los contactos abiertos", "d": ["Está bien si el motor está en marcha", "Está bien, porque los contactos principales son NC", "Da igual: cada uno lo dibuja como quiere"], "j": "Los esquemas se dibujan sin tensión y sin que nadie accione nada.", "img": null, "cap": ""}, {"tema": "T1", "t": "T1 · Parte 1 (¡OJO!)", "dif": "M", "tipo": "SIM", "q": "¿Por qué -KM1 aparece en dos sitios: los contactos principales en la fuerza y la bobina en el mando?", "ok": "El esquema no es un dibujo del aparato: lo que une las partes es el nombre -KM1", "d": ["Son dos contactores distintos con el mismo nombre", "Es un error: tendría que salir una sola vez", "Porque la bobina y los contactos van en aparatos separados"], "j": "El contactor real tiene todo junto, pero en el esquema cada parte va donde trabaja.", "img": null, "cap": ""}, {"tema": "T1", "t": "T1 · Parte 2, §4", "dif": "D", "tipo": "SIM", "q": "En el esquema de mando, ¿de qué color se pinta el cable que une el 14 con A1, y el que une A2 con N?", "ok": "14-A1 rojo y A2-N azul", "d": ["Los dos rojos", "Los dos azules", "14-A1 azul y A2-N rojo"], "j": "Todo lo que está antes de la bobina es fase (rojo); lo que va después, hasta el N, es neutro (azul).", "img": null, "cap": ""}, {"tema": "T2", "t": "T2 · 2.4 (ejemplo 1)", "dif": "M", "tipo": "SEG", "q": "El fusible del mando se ha fundido. ¿Qué haces?", "ok": "Quitar tensión, cambiarlo por otro igual (tamaño, clase y amperios) y buscar por qué se fundió", "d": ["Poner uno de más amperios para que no vuelva a saltar", "Medirlo en su base con tensión para asegurarte", "Puentearlo con un cable hasta tener repuesto"], "j": "El fusible es el punto débil a propósito: si no se funde él, se quema el cable o el aparato.", "img": null, "cap": ""}, {"tema": "T2", "t": "T2 · 2.4 (tipos)", "dif": "D", "tipo": "SIM", "q": "Un fusible aM protege un motor. ¿Qué más hace falta?", "ok": "Un relé térmico, porque el aM solo protege contra cortocircuitos", "d": ["Nada: el aM protege contra sobrecargas y cortocircuitos", "Un diferencial, porque el aM no aguanta el arranque", "Otro fusible gG en serie para el mando"], "j": "El aM aguanta el arranque sin fundirse y siempre va con un térmico, que se encarga de la sobrecarga.", "img": null, "cap": ""}, {"tema": "T2", "t": "T2 · 2.7 (¡OJO!)", "dif": "D", "tipo": "SEG", "q": "Un alumno lleva la fase al COM del detector fotoeléctrico y el neutro directamente al NA. ¿Qué pasa al detectar?", "ok": "Cortocircuito: el relé une fase y neutro", "d": ["Solo se enciende el LED del detector", "El detector no se alimenta", "Funciona igual que con una bobina conectada"], "j": "Entre el NA y el N siempre tiene que haber una carga (bobina o piloto).", "img": null, "cap": ""}, {"tema": "T2", "t": "T2 · 2.7", "dif": "M", "tipo": "SIM", "q": "Quieres que -KM1 se suelte cuando el detector fotoeléctrico detecte algo. ¿Cómo lo conectas?", "ok": "COM a la fase y NC hacia la bobina de -KM1", "d": ["COM a la fase y NA hacia la bobina de -KM1", "La alimentación L y N del detector a la bobina", "COM al neutro y NA hacia la bobina"], "j": "El NC se abre al detectar: corta la corriente a la bobina.", "img": null, "cap": ""}, {"tema": "T2", "t": "T2 · 2.9 (¡OJO!)", "dif": "D", "tipo": "SEG", "q": "Conectas una bobina de contactor de 230 V en alterna a una fuente de continua. ¿Qué pasa?", "ok": "Se quema: sin alterna pasa demasiada corriente", "d": ["No se activa, pero no le pasa nada", "Funciona igual", "Zumba un poco pero aguanta"], "j": "En alterna hay un «freno» que limita la corriente; en continua no lo hay.", "img": null, "cap": ""}, {"tema": "T2", "t": "T2 · 2.9 (ejemplo 3)", "dif": "M", "tipo": "MED", "q": "Sin tensión mides la bobina de un contactor entre A1 y A2 y marca 0 Ω. ¿Qué le pasa?", "ok": "Está en cortocircuito", "d": ["Está bien", "Está cortada", "Tiene un NC cerrado"], "j": "Una bobina bien da decenas o cientos de ohmios; infinito (OL) sería cortada.", "img": null, "cap": ""}, {"tema": "T2", "t": "T2 · 2.11", "dif": "M", "tipo": "SEG", "q": "¿Por qué es peligroso dejar el térmico en rearme automático (A)?", "ok": "Porque el motor volvería a arrancar solo", "d": ["Porque el térmico ya no dispara", "Porque se abre el 97-98", "Porque el contactor se queda soldado"], "j": "En manual (H) alguien tiene que pulsar RESET después de mirar por qué ha saltado.", "img": null, "cap": ""}, {"tema": "T2", "t": "T2 · 2.11 (¡OJO!)", "dif": "M", "tipo": "SEG", "q": "El relé térmico no protege contra cortocircuitos. ¿Qué se pone para eso?", "ok": "Un magnetotérmico o fusibles aM delante", "d": ["El propio térmico con la ruleta al máximo", "El contactor", "Un diferencial"], "j": "El térmico protege solo de sobrecargas; el diferencial protege a las personas.", "img": null, "cap": ""}, {"tema": "T2", "t": "T2 · 2.11 (idea clave)", "dif": "D", "tipo": "SIM", "q": "A un motor le falta una fase. ¿Qué hace el térmico?", "ok": "Dispara antes: los bimetales se doblan de forma desigual", "d": ["No lo nota, porque la corriente total baja", "Nada: eso lo detecta el diferencial", "Abre sus contactos 1-2, 3-4 y 5-6"], "j": "Las otras dos fases llevan más corriente y el mecanismo detecta que los bimetales se curvan distinto.", "img": null, "cap": ""}, {"tema": "T2", "t": "T2 · 2.5 (colores)", "dif": "M", "tipo": "SEG", "q": "¿Cómo es la parada de emergencia?", "ok": "Seta roja sobre fondo amarillo, NC, que se queda enclavada y se desbloquea girándola", "d": ["Pulsador rojo NC que vuelve solo a reposo", "Seta amarilla NA que se rearma pulsando", "Pulsador azul NA de rearme"], "j": "Sus NC son de apertura positiva: el mecanismo separa los contactos a la fuerza.", "img": null, "cap": ""}, {"tema": "T3", "t": "P1 · 1.3", "dif": "M", "tipo": "PULSA", "q": "Pulsas solo -S3 y lo mantienes. ¿Qué pasa?", "ok": "-KM1 se activa mientras lo pulses y se enciende -H1", "d": ["-KM1 se activa y se queda activado al soltar", "-KM1 no se activa", "-KM1 se activa y se enciende -H2"], "j": "El 3-4 de -S3 se cierra y el 1-2 de -S4 sigue cerrado. No hay realimentación: al soltar, se suelta.", "img": "fig13.png", "cap": "Dos pulsadores en paralelo pero excluyentes (Práctica 1, apartado 1.3)."}, {"tema": "T3", "t": "P1 · 1.3 (pista)", "dif": "D", "tipo": "PULSA", "q": "Tienes -S3 pulsado y -KM1 activado. Sin soltarlo, pulsas también -S4. ¿Qué pasa?", "ok": "-KM1 se suelta", "d": ["-KM1 sigue activado", "-KM1 sigue activado porque las ramas están en paralelo", "Salta -Q1"], "j": "Cada pulsador abre con su 1-2 la rama del otro: con los dos pulsados no queda camino.", "img": "fig13.png", "cap": "Dos pulsadores en paralelo pero excluyentes (Práctica 1, apartado 1.3)."}, {"tema": "T3", "t": "P1 · proceso (¡OJO!)", "dif": "M", "tipo": "MED", "q": "Sin tensión y en reposo, mides continuidad con las puntas en L y N. ¿Qué tiene que pasar?", "ok": "No debe pitar", "d": ["Debe pitar: la corriente pasa por la bobina", "Debe marcar 0 Ω", "Debe pitar solo un poco por los pilotos"], "j": "Si pita entre L y N en reposo hay un cortocircuito: no se conecta.", "img": "fig13.png", "cap": "Dos pulsadores en paralelo pero excluyentes (Práctica 1, apartado 1.3)."}, {"tema": "T3", "t": "P1 · proceso (¡OJO!)", "dif": "D", "tipo": "MED", "q": "Sin tensión, puntas en L y N, y mantienes -S3 pulsado. ¿Qué marca el polímetro?", "ok": "Baja a la resistencia de la bobina, pero nunca a 0 Ω", "d": ["0 Ω y pita", "Sigue en infinito", "Infinito, porque -S4 está abierto"], "j": "Al pulsar, el camino pasa por la bobina, que tiene decenas o cientos de ohmios.", "img": "fig13.png", "cap": "Dos pulsadores en paralelo pero excluyentes (Práctica 1, apartado 1.3)."}, {"tema": "T3", "t": "P1 · 1.3", "dif": "M", "tipo": "SIM", "q": "¿Para qué lleva la rama de -S3 el 1-2 de -S4?", "ok": "Para que, al pulsar los dos, cada uno abra la rama del otro", "d": ["Para realimentar -KM1", "Para que -S4 haga de paro general", "Para que -S3 solo funcione con -S4 pulsado"], "j": "Así son «excluyentes»: funciona con uno solo, pero no con los dos a la vez.", "img": "fig13.png", "cap": "Dos pulsadores en paralelo pero excluyentes (Práctica 1, apartado 1.3)."}, {"tema": "T3", "t": "T3 · 3.4", "dif": "M", "tipo": "PULSA", "q": "Motor parado. ¿Con cuál de estas formas arranca?", "ok": "Pulsando -S4 y -S5 a la vez", "d": ["Pulsando -S5 solo", "Pulsando -S3 y -S4 a la vez", "Pulsando -S3 solo"], "j": "(-S3 o -S4) en serie con -S5: hace falta uno de los dos primeros y además -S5.", "img": "fig03.png", "cap": "Una combinación de paros y marchas."}, {"tema": "T3", "t": "T3 · 3.4", "dif": "M", "tipo": "PULSA", "q": "Motor en marcha. ¿Qué pulsador lo para él solo?", "ok": "-S0", "d": ["-S1", "-S2", "-S5"], "j": "-S0 está en serie con todo. -S1 y -S2 están en paralelo (hay que pulsar los dos) y -S5 está puenteado por el 13-14.", "img": "fig03.png", "cap": "Una combinación de paros y marchas."}, {"tema": "T3", "t": "T3 · 3.4", "dif": "D", "tipo": "PULSA", "q": "Motor en marcha. Pulsas -S1 y lo mantienes; después pulsas también -S2. ¿Cuándo se para?", "ok": "Al pulsar -S2", "d": ["Al pulsar -S1", "No se para: solo lo para -S0", "Al soltar -S1"], "j": "Con -S1 pulsado la corriente sigue por -S2; al abrir también -S2 no queda camino.", "img": "fig03.png", "cap": "Una combinación de paros y marchas."}, {"tema": "T3", "t": "T3 · 3.4", "dif": "D", "tipo": "PULSA", "q": "Motor parado. Mantienes pulsado -S2 y pulsas -S3 y -S5 a la vez. ¿Qué pasa?", "ok": "Arranca: la corriente pasa por -S1", "d": ["No arranca: -S2 corta el camino", "Arranca solo mientras pulses -S3 y -S5", "No arranca hasta que sueltes -S2"], "j": "-S1 y -S2 están en paralelo: con uno solo abierto la corriente sigue por el otro.", "img": "fig03.png", "cap": "Una combinación de paros y marchas."}, {"tema": "T3", "t": "T3 · 3.4", "dif": "D", "tipo": "PULSA", "q": "Motor parado. Mantienes pulsados -S1 y -S2 y pulsas -S3 y -S5. ¿Qué pasa?", "ok": "No arranca", "d": ["Arranca y se queda en marcha", "Arranca solo mientras pulses -S3 y -S5", "Arranca solo si pulsas también -S4"], "j": "Con -S1 y -S2 abiertos a la vez, el grupo de paros en paralelo corta el único camino.", "img": "fig03.png", "cap": "Una combinación de paros y marchas."}, {"tema": "T3", "t": "T3 · 3.3-3.4", "dif": "M", "tipo": "MAL", "q": "Si quitas el cable del 13-14 de -KM1 y pulsas -S4 y -S5 a la vez, ¿qué pasa?", "ok": "-KM1 funciona solo mientras los mantienes pulsados", "d": ["Arranca y se queda en marcha", "No arranca nunca", "Arranca, pero ya no se para con -S0"], "j": "Sin realimentación no hay 'memoria': al soltar los pulsadores no queda camino hasta la bobina.", "img": "fig03.png", "cap": "Una combinación de paros y marchas."}, {"tema": "T3", "t": "T3 · 3.4 / R3 · 5-6", "dif": "M", "tipo": "SIM", "q": "¿Cómo se lee el grupo de marchas -S3, -S4 y -S5?", "ok": "(-S3 o -S4) y -S5", "d": ["-S3 y -S4 y -S5", "-S3 o -S4 o -S5", "(-S3 y -S4) o -S5"], "j": "Paralelo = «o», serie = «y». -S3 y -S4 están en paralelo, y ese grupo en serie con -S5.", "img": "fig03.png", "cap": "Una combinación de paros y marchas."}, {"tema": "T3", "t": "T3 · 3.3 / P2 · 2.1", "dif": "M", "tipo": "PULSA", "q": "-KM1 está parado. Pulsas -S1 y -S2 a la vez. ¿Qué pasa?", "ok": "No se activa: gana el paro", "d": ["Se activa mientras los pulses", "Se activa y se queda activado al soltarlos", "Se activa y salta -Q1"], "j": "-S2 está encima de todo y corta las dos ramas: es la realimentación con prioridad al paro.", "img": "fig04.png", "cap": "Dos formas de realimentar: -KM1 y -KM2."}, {"tema": "T3", "t": "T3 · 3.3 (prioridad a la marcha)", "dif": "D", "tipo": "PULSA", "q": "-KM2 está parado. Pulsas -S3 y -S4 a la vez; después sueltas primero -S3 y luego -S4. ¿Qué hace -KM2?", "ok": "Se activa y se suelta al soltar -S3", "d": ["Se activa y se queda activado", "No llega a activarse", "Se activa al soltar -S4"], "j": "-S3 llega directo a la bobina. Al soltarlo, la realimentación está cortada por -S4: se suelta y su 13-14 se abre.", "img": "fig04.png", "cap": "Dos formas de realimentar: -KM1 y -KM2."}, {"tema": "T3", "t": "T3 · 3.3 (prioridad a la marcha)", "dif": "D", "tipo": "PULSA", "q": "-KM2 está en marcha. Mantienes pulsado -S4 y, sin soltarlo, pulsas y sueltas -S3. ¿Cómo queda -KM2 mientras sigues con -S4 pulsado?", "ok": "En reposo", "d": ["Activado", "Activado hasta que sueltes -S4", "Activado, y salta -Q1"], "j": "Mientras -S4 está pulsado la realimentación está cortada: -KM2 solo está activado mientras pulsas -S3.", "img": "fig04.png", "cap": "Dos formas de realimentar: -KM1 y -KM2."}, {"tema": "T3", "t": "T3 · 3.3 (¡OJO!)", "dif": "M", "tipo": "SEG", "q": "¿En qué rama, si el pulsador de marcha se queda enganchado, el paro no puede parar la máquina?", "ok": "En la de -KM2", "d": ["En la de -KM1", "En las dos", "En ninguna de las dos"], "j": "En la prioridad a la marcha la marcha va directa a la bobina, sin pasar por el paro. Por eso casi no se usa.", "img": "fig04.png", "cap": "Dos formas de realimentar: -KM1 y -KM2."}, {"tema": "T3", "t": "T3 · 3.3 (paso 5)", "dif": "D", "tipo": "SEG", "q": "Los dos contactores están en marcha y se va la luz. Al volver, ¿cómo quedan?", "ok": "Los dos parados", "d": ["-KM2 arranca solo, porque tiene prioridad a la marcha", "Los dos arrancan solos", "-KM1 arranca solo"], "j": "Sin tensión los dos se sueltan y abren su 13-14. Las dos realimentaciones necesitan que alguien pulse marcha.", "img": "fig04.png", "cap": "Dos formas de realimentar: -KM1 y -KM2."}, {"tema": "T3", "t": "T3 · 3.3 / R3 · 11", "dif": "M", "tipo": "PULSA", "q": "El motor está en marcha (-KM1 activado). ¿Qué pilotos están encendidos?", "ok": "Solo -H2", "d": ["-H2 y -H3", "-H1 y -H2", "Solo -H3"], "j": "Con -KM1 activado se cierra el 53-54 (-H2) y se abre el 61-62 (-H3); el 97-98 sigue abierto (-H1).", "img": "fig02.png", "cap": "Marcha-paro de -KM1 con señalización. -H1: avería (rojo) · -H2: marcha (verde) · -H3: parado."}, {"tema": "T4", "t": "T4 · 4.4 / T2 · 2.11", "dif": "D", "tipo": "PULSA", "q": "Con el motor en marcha salta el térmico -F2. ¿Qué pilotos quedan encendidos?", "ok": "-H1 y -H3", "d": ["Solo -H1", "-H1 y -H2", "-H1, -H2 y -H3"], "j": "El 97-98 se cierra (-H1); el 95-96 se abre, -KM1 se suelta, su 53-54 se abre (-H2 se apaga) y su 61-62 se cierra (-H3).", "img": "fig02.png", "cap": "Marcha-paro de -KM1 con señalización. -H1: avería (rojo) · -H2: marcha (verde) · -H3: parado."}, {"tema": "T3", "t": "T3 · 3.3 / P2 · 2.3", "dif": "M", "tipo": "MED", "q": "Todo en reposo. Polímetro en V~, punta negra en N y roja en el tornillo 3 de -S1. ¿Qué lees?", "ok": "230 V", "d": ["0 V, porque -S1 está abierto", "0 V, porque -KM1 está en reposo", "230 V solo mientras pulses -S1"], "j": "La fase llega hasta el 3 de -S1 porque el 95-96 y el 1-2 de -S0 están cerrados en reposo.", "img": "fig02.png", "cap": "Marcha-paro de -KM1 con señalización. -H1: avería (rojo) · -H2: marcha (verde) · -H3: parado."}, {"tema": "T3", "t": "T3 · 3.3 / P2 · 2.3", "dif": "D", "tipo": "MED", "q": "Todo en reposo. Punta negra en N y roja en A1 de -KM1. ¿Qué lees y por qué?", "ok": "0 V, porque -S1 y el 13-14 están abiertos", "d": ["230 V, porque A1 va siempre a la fase", "0 V, porque -S0 está abierto en reposo", "230 V, porque el 13-14 es NC"], "j": "A A1 solo se llega por -S1 o por el 13-14, y los dos son NA: en reposo están abiertos.", "img": "fig02.png", "cap": "Marcha-paro de -KM1 con señalización. -H1: avería (rojo) · -H2: marcha (verde) · -H3: parado."}, {"tema": "T2", "t": "T2 · 2.5", "dif": "M", "tipo": "SEG", "q": "Con el motor en marcha se suelta el cable del tornillo 2 de -S0. ¿Qué pasa?", "ok": "El motor se para: el paro es NC (seguridad positiva)", "d": ["El motor sigue y ya no hay forma de pararlo", "El motor sigue hasta que pulses -S0", "Salta -Q1 por cortocircuito"], "j": "Un cable suelto abre el circuito igual que pulsar el NC: la máquina se queda en el estado seguro, parada.", "img": "fig02.png", "cap": "Marcha-paro de -KM1 con señalización. -H1: avería (rojo) · -H2: marcha (verde) · -H3: parado."}, {"tema": "T2", "t": "T2 · 2.9 (bloque auxiliar)", "dif": "M", "tipo": "SIM", "q": "El 61-62 de -KM1 se ha estropeado. ¿Qué otro contacto del bloque puedes usar para -H3 sin cambiar nada más?", "ok": "El 71-72", "d": ["El 83-84", "El 53-54", "El 13-14"], "j": "El bloque es NA·NC·NC·NA: los NC son el 61-62 y el 71-72.", "img": "fig02.png", "cap": "Marcha-paro de -KM1 con señalización. -H1: avería (rojo) · -H2: marcha (verde) · -H3: parado."}, {"tema": "T3", "t": "T3 · 3.3 (paso 5)", "dif": "D", "tipo": "SEG", "q": "Con el motor en marcha se va la luz y vuelve al cabo de un minuto. ¿Cómo queda?", "ok": "Parado, con -H3 encendido", "d": ["En marcha: el 13-14 recuerda que estaba arrancado", "En marcha, con -H2 encendido", "Parado, con -H1 encendido"], "j": "Sin tensión -KM1 se suelta y abre su 13-14; al volver la luz no arranca solo, hay que pulsar marcha.", "img": "fig02.png", "cap": "Marcha-paro de -KM1 con señalización. -H1: avería (rojo) · -H2: marcha (verde) · -H3: parado."}, {"tema": "T3", "t": "T3 · 3.3", "dif": "D", "tipo": "MAL", "q": "Un alumno conecta el 13-14 de -KM1 en paralelo con -S0 en vez de con -S1. ¿Qué pasa al montarlo?", "ok": "-KM1 solo funciona mientras mantienes pulsado -S1", "d": ["Funciona igual que el esquema", "-KM1 arranca y ya no se puede parar", "-KM1 no arranca nunca"], "j": "La realimentación tiene que puentear la marcha. Puenteando el paro, al soltar -S1 no queda camino hasta la bobina.", "img": "fig02.png", "cap": "Marcha-paro de -KM1 con señalización. -H1: avería (rojo) · -H2: marcha (verde) · -H3: parado."}, {"tema": "T3", "t": "T3 · 3.6 / R3 · 8", "dif": "D", "tipo": "PULSA", "q": "-KM1 está en marcha. Sin pulsar -S0, pulsas -S2. ¿Qué pasa?", "ok": "-KM1 se suelta y entra -KM2", "d": ["Nada: antes hay que pulsar -S0", "Entran los dos a la vez", "Se suelta -KM1 y -KM2 no entra"], "j": "El 1-2 de -S2 corta la rama de -KM1; al soltarse -KM1 su 61-62 se cierra y -S2 (3-4) activa -KM2.", "img": "fig05.png", "cap": "Mando de una inversión de giro con doble enclavamiento."}, {"tema": "T3", "t": "T3 · 3.6", "dif": "M", "tipo": "PULSA", "q": "Si quitas los 1-2 de los pulsadores (dejando solo los 61-62), -KM1 está en marcha y pulsas -S2, ¿qué pasa?", "ok": "Nada: -KM1 sigue y -KM2 no entra", "d": ["-KM1 se suelta y entra -KM2", "Entran los dos a la vez", "Se sueltan los dos"], "j": "El 61-62 de -KM1 está abierto y bloquea a -KM2. Para cambiar de sentido hay que pulsar antes -S0.", "img": "fig05.png", "cap": "Mando de una inversión de giro con doble enclavamiento."}, {"tema": "T3", "t": "T3 · 3.6", "dif": "M", "tipo": "SIM", "q": "Con -KM1 activado, ¿qué contacto impide que entre -KM2?", "ok": "El 61-62 de -KM1, que está en la rama de -KM2", "d": ["El 61-62 de -KM2, que está en la rama de -KM1", "El 13-14 de -KM1", "El 1-2 de -S1"], "j": "En el enclavamiento el NC de cada contactor va en serie con la bobina del otro.", "img": "fig05.png", "cap": "Mando de una inversión de giro con doble enclavamiento."}, {"tema": "T3", "t": "T3 · 3.5-3.6", "dif": "D", "tipo": "MAL", "q": "Un alumno pone el 53-54 en lugar del 61-62 en las dos ramas. ¿Qué pasa?", "ok": "Ninguno de los dos contactores puede arrancar", "d": ["Funciona igual", "Pueden entrar los dos a la vez", "Solo arranca -KM1"], "j": "Con un NA, cada contactor necesita que el otro ya esté activado; como los dos empiezan parados, ninguno entra.", "img": "fig05.png", "cap": "Mando de una inversión de giro con doble enclavamiento."}, {"tema": "T3", "t": "T3 · 3.6 / R3 · 8", "dif": "D", "tipo": "PULSA", "q": "Todo parado. Pulsas -S1 y -S2 exactamente a la vez. ¿Qué pasa?", "ok": "No entra ninguno", "d": ["Entra -KM1", "Entran los dos", "Entra -KM2"], "j": "Cada pulsador cierra su 3-4 pero abre su 1-2 en la rama del otro: las dos ramas quedan cortadas.", "img": "fig05.png", "cap": "Mando de una inversión de giro con doble enclavamiento."}, {"tema": "T3", "t": "T3 · 3.6 (¿Por qué?)", "dif": "M", "tipo": "SIM", "q": "¿Por qué el enclavamiento se hace con un contacto NC?", "ok": "Porque en reposo deja pasar y solo se abre cuando su contactor está activado", "d": ["Porque un NA se quemaría", "Porque los NC aguantan más corriente que los NA", "Porque el NC se cierra al activarse el contactor"], "j": "Hay que bloquear al otro contactor justo cuando este está activado, y no antes.", "img": "fig05.png", "cap": "Mando de una inversión de giro con doble enclavamiento."}, {"tema": "T3", "t": "T3 · 3.5 / P2 · 2.4", "dif": "M", "tipo": "PULSA", "q": "Todo parado. Pulsas -S3, luego -S2 y luego -S1 (uno detrás de otro). ¿Qué queda activado?", "ok": "Solo -KM1", "d": ["Los tres", "-KM1 y -KM2", "Ninguno"], "j": "Cuando pulsaste -S3 y -S2, los 53-54 de -KM2 y -KM1 estaban abiertos. Solo -S1 consiguió arrancar.", "img": "fig06.png", "cap": "Tres contactores con activación condicionada."}, {"tema": "T3", "t": "T3 · 3.5", "dif": "D", "tipo": "PULSA", "q": "Los tres están en marcha y se suelta el cable de A1 de -KM1. ¿Qué pasa?", "ok": "Se paran los tres", "d": ["Solo se para -KM1", "Se paran -KM1 y -KM2", "Se paran -KM1 y -KM3"], "j": "-KM1 se suelta y abre su 53-54: cae -KM2, que abre el suyo, y cae -KM3. Es una cadena.", "img": "fig06.png", "cap": "Tres contactores con activación condicionada."}, {"tema": "T3", "t": "T3 · 3.5-3.6", "dif": "D", "tipo": "MAL", "q": "En la rama de -KM3 cambias el 53-54 de -KM2 por el 61-62 de -KM2. ¿Qué pasa?", "ok": "-KM3 solo puede arrancar si -KM2 está parado", "d": ["Funciona igual", "-KM3 no arranca nunca", "-KM3 arranca aunque -KM2 esté activado"], "j": "Con el NC ya no es una condición sino un enclavamiento: bloquea a -KM3 cuando -KM2 está activado.", "img": "fig06.png", "cap": "Tres contactores con activación condicionada."}, {"tema": "T3", "t": "T3 · 3.5", "dif": "D", "tipo": "MAL", "q": "En la rama de -KM2, un alumno pone el 53-54 de -KM1 en serie solo con -S2, y no con el 13-14 de -KM2. ¿Qué pasa?", "ok": "-KM2 solo arranca con -KM1 en marcha, pero si luego se para -KM1, -KM2 sigue", "d": ["Funciona igual que el esquema", "-KM2 no arranca nunca", "-KM2 arranca aunque -KM1 esté parado"], "j": "El 13-14 de -KM2 hace otro camino que no pasa por el 53-54: la condición solo vale para arrancar.", "img": "fig06.png", "cap": "Tres contactores con activación condicionada."}, {"tema": "T3", "t": "T3 · 3.5 / P2 · 2.3", "dif": "D", "tipo": "MED", "q": "-KM1 en marcha y -KM2 parado. Punta negra en N y roja en el 54 de -KM1 (rama de -KM2). ¿Qué lees?", "ok": "0 V: -S2 y el 13-14 de -KM2 están abiertos", "d": ["230 V: el 53-54 de -KM1 está cerrado", "230 V, porque -KM1 está activado", "0 V, porque el 53-54 está abierto"], "j": "El 53-54 está cerrado, pero antes de él la fase solo llega por -S2 o por el 13-14 de -KM2, y los dos están abiertos.", "img": "fig06.png", "cap": "Tres contactores con activación condicionada."}, {"tema": "T3", "t": "T3 · 3.7", "dif": "M", "tipo": "PULSA", "q": "Pulsas -S1 y lo sueltas. ¿Cómo queda el circuito?", "ok": "-KA1 y -KM1 activados, -H1 encendido y -H2 apagado", "d": ["Todo vuelve a reposo al soltar -S1", "-KM1 activado y -H2 encendido", "-KA1 activado, pero -KM1 no"], "j": "-KA1 se sujeta con su 11-14 y cambia sus tres láminas a la vez: 21 pasa al 24 y 31 se une con el 34.", "img": "fig07.png", "cap": "El relé -KA1 reparte la orden. -H1: marcha · -H2: parado."}, {"tema": "T3", "t": "T3 · 3.7", "dif": "D", "tipo": "PULSA", "q": "La bobina de -KA1 está cortada (rota). Pulsas -S1. ¿Qué pasa?", "ok": "Nada: -KM1 no entra y -H2 sigue encendido", "d": ["-KM1 entra mientras pulsas -S1", "-H1 se enciende", "-KM1 entra y se queda en marcha"], "j": "-S1 solo alimenta la bobina de -KA1. Si -KA1 no se mueve, sus conmutados siguen en reposo.", "img": "fig07.png", "cap": "El relé -KA1 reparte la orden. -H1: marcha · -H2: parado."}, {"tema": "T3", "t": "T3 · 3.7 / T2 · 2.10", "dif": "D", "tipo": "MED", "q": "Todo en reposo. Punta negra en N y roja en el 24 de -KA1. ¿Qué lees?", "ok": "0 V: en reposo el 21 toca el 22, no el 24", "d": ["230 V: el 24 es el NA y está cerrado", "230 V, porque la bobina de -KM1 tiene tensión", "0 V, porque el 21 no tiene tensión"], "j": "El 21 sí tiene fase (viene de -Q1), pero en reposo la lámina toca el 22: el 24 queda sin tensión.", "img": "fig07.png", "cap": "El relé -KA1 reparte la orden. -H1: marcha · -H2: parado."}, {"tema": "T3", "t": "T3 · 3.7", "dif": "M", "tipo": "SIM", "q": "¿Por qué en este esquema el pulsador activa -KA1 en vez de activar directamente -KM1 y los pilotos?", "ok": "Porque una sola bobina cambia todos sus contactos a la vez y reparte la orden", "d": ["Porque el relé es el que mueve el motor", "Porque el contactor no tiene contactos NC", "Porque así no hace falta pulsador de paro"], "j": "El relé auxiliar se usa cuando faltan contactos o para que una orden llegue a muchos sitios a la vez.", "img": "fig07.png", "cap": "El relé -KA1 reparte la orden. -H1: marcha · -H2: parado."}, {"tema": "T3", "t": "T3 · 3.8", "dif": "M", "tipo": "SIM", "q": "¿En qué tornillo de la base se conecta A1 de la bobina?", "ok": "En el 13", "d": ["En el 1", "En el 14", "En el 9"], "j": "La bobina es siempre 13 (A1) y 14 (A2).", "img": "fig08.png", "cap": "Base de un relé de 4 contactos, con la numeración de 1 a 14 grabada junto a cada tornillo."}, {"tema": "T3", "t": "T3 · 3.8", "dif": "D", "tipo": "SIM", "q": "Relé de 4 contactos. ¿En qué tornillos de la base está el contacto 31-32-34?", "ok": "Común 11, NC 3 y NA 7", "d": ["Común 3, NC 7 y NA 11", "Común 9, NC 1 y NA 5", "Común 11, NC 7 y NA 3"], "j": "Es el 3.er contacto: NC en n = 3, NA en n + 4 = 7 y común en n + 8 = 11.", "img": "fig08.png", "cap": "Base de un relé de 4 contactos, con la numeración de 1 a 14 grabada junto a cada tornillo."}, {"tema": "T3", "t": "T3 · 3.8 (¡OJO!)", "dif": "D", "tipo": "SIM", "q": "En un relé de 2 contactos, ¿en qué tornillos de la base está el 21-22-24?", "ok": "Común 12, NC 4 y NA 8", "d": ["Común 10, NC 2 y NA 6", "Común 9, NC 1 y NA 5", "Común 11, NC 3 y NA 7"], "j": "El relé de 2 contactos usa las posiciones 1.ª y 4.ª: el segundo contacto está en la 4.ª (12-4-8).", "img": "fig08.png", "cap": "Base de un relé de 4 contactos, con la numeración de 1 a 14 grabada junto a cada tornillo."}, {"tema": "T3", "t": "T3 · 3.8 (¡OJO!)", "dif": "D", "tipo": "SIM", "q": "Si en esta base pones un relé de 3 contactos, ¿qué tornillos no se usan?", "ok": "El 4, el 8 y el 12", "d": ["El 1, el 5 y el 9", "El 13 y el 14", "El 2, el 6 y el 10"], "j": "El de 3 contactos usa las tres primeras posiciones y le falta la 4.ª: 4, 8 y 12.", "img": "fig08.png", "cap": "Base de un relé de 4 contactos, con la numeración de 1 a 14 grabada junto a cada tornillo."}, {"tema": "T3", "t": "T3 · 3.8", "dif": "M", "tipo": "SIM", "q": "En un relé de 4 contactos, ¿qué es el tornillo 5 de la base en la numeración del esquema?", "ok": "El 14", "d": ["El 11", "El 12", "A1"], "j": "La fila 5-8 son los NA; el 5 es el NA del primer contacto: el 14.", "img": "fig08.png", "cap": "Base de un relé de 4 contactos, con la numeración de 1 a 14 grabada junto a cada tornillo."}, {"tema": "T3", "t": "T3 · 3.7", "dif": "M", "tipo": "SIM", "q": "¿Por qué un relé auxiliar no sirve para arrancar directamente un motor?", "ok": "No tiene contactos principales: sus contactos solo aguantan corrientes de mando", "d": ["Porque su bobina es siempre de 24 V", "Porque no tiene contactos NC", "Porque va enchufado en una base"], "j": "Para mover el motor está el contactor; el relé solo maneja señales de mando.", "img": null, "cap": ""}, {"tema": "T3", "t": "T3 · 3.7", "dif": "D", "tipo": "SIM", "q": "Contando el 13-14 y el bloque auxiliar, ¿cuántos contactos auxiliares tiene un contactor del aula?", "ok": "3 NA y 2 NC", "d": ["2 NA y 2 NC", "4 NA y 1 NC", "3 NA y 3 NC"], "j": "13-14 (NA) + 53-54 (NA), 61-62 (NC), 71-72 (NC) y 83-84 (NA).", "img": null, "cap": ""}, {"tema": "T3", "t": "T3 · 3.9 (por qué se separan)", "dif": "D", "tipo": "SEG", "q": "¿Por qué en muchas máquinas el mando se hace a 24 V con un transformador?", "ok": "Para que lo que toca la persona (pulsadores) vaya a una tensión no peligrosa", "d": ["Para que el motor dé más potencia", "Para ahorrar cable de fuerza", "Para que el térmico dispare antes"], "j": "Es una de las razones para separar fuerza y mando: seguridad.", "img": null, "cap": ""}, {"tema": "T4", "t": "T4 · 4.1 / 4.9 (idea clave)", "dif": "M", "tipo": "PULSA", "q": "Pulsas -S1: -KM1 se activa (oyes el golpe), pero el motor no gira. ¿Dónde buscas la avería?", "ok": "En la fuerza", "d": ["En el mando", "En el pulsador -S1", "En la bobina A1-A2"], "j": "Si el contactor se activa, el mando funciona. La avería está entre -Q1, los contactos principales, -F2, -X1 y el motor.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha)."}, {"tema": "T3", "t": "T3 · 3.9 (por qué se separan)", "dif": "D", "tipo": "SEG", "q": "Hay un cortocircuito en el cable de un pulsador. ¿Qué salta?", "ok": "-Q2, y -Q1 no", "d": ["-Q1, y -Q2 no", "Los dos magnetotérmicos", "El térmico -F2"], "j": "Cada circuito tiene su protección: el pulsador está en el mando, protegido por -Q2. El térmico no protege de cortocircuitos.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha)."}, {"tema": "T4", "t": "P3 · medidas 6-7", "dif": "M", "tipo": "MED", "q": "Con -Q1 subido y -KM1 en reposo, mides tensión entre U y V del motor. ¿Qué lees?", "ok": "0 V", "d": ["230 V", "400 V", "230 V solo si -F2 está rearmado"], "j": "Los contactos principales de -KM1 están abiertos: la tensión no pasa del contactor.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha)."}, {"tema": "T4", "t": "P3 · medida 8 / T4 · 4.1", "dif": "M", "tipo": "MED", "q": "Con -KM1 activado, abrazas con la pinza solo el cable que va a A1. ¿Qué marca?", "ok": "Unas centésimas de amperio", "d": ["Varios amperios, como el motor", "0 A: por la bobina no pasa corriente", "Lo mismo que el cable de -X1:1"], "j": "La bobina pide muy poca corriente (unos 0,03-0,05 A); el motor pide amperios. Por eso los cables son distintos.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha)."}, {"tema": "T4", "t": "P3 · medidas (¡OJO!)", "dif": "D", "tipo": "MED", "q": "Con el motor en marcha abrazas con la pinza los tres cables del motor a la vez. Marca 0 A. ¿Por qué?", "ok": "Las tres corrientes se anulan: hay que abrazar un solo cable", "d": ["El motor está parado", "La pinza está en tensión en vez de en intensidad", "Los motores trifásicos no se pueden medir con pinza"], "j": "Con la pinza se abraza un solo cable; en el bornero -X1 es fácil coger uno.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha)."}, {"tema": "T4", "t": "P3 · medida 4 / T2 · 2.9", "dif": "M", "tipo": "MED", "q": "Sin tensión, con el polímetro en continuidad entre 1/L1 y 2/T1 de -KM1 en reposo, ¿qué pasa?", "ok": "No pita (infinito): es un contacto NA abierto", "d": ["Pita: el contacto está cerrado", "Marca la resistencia de la bobina", "Pita solo si -F2 está rearmado"], "j": "Los contactos principales son NA: solo se cierran con la bobina activada.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha)."}, {"tema": "T4", "t": "T4 · 4.4 / T2 · 2.11", "dif": "D", "tipo": "PULSA", "q": "Salta el térmico -F2. ¿Qué aparato corta la corriente del motor?", "ok": "-KM1, porque su bobina se queda sin corriente", "d": ["-F2, que abre sus contactos 1-2, 3-4 y 5-6", "-Q1, que salta a la vez", "El 97-98 de -F2"], "j": "El térmico solo abre su 95-96 en el mando; es el contactor quien suelta el motor.", "img": "fig09.png", "cap": "Arranque directo de un motor: fuerza (izquierda) y mando (derecha)."}, {"tema": "T4", "t": "T4 · 4.1 (separados en el papel…)", "dif": "M", "tipo": "APA", "q": "De los tornillos marcados con letras, ¿cuáles son de fuerza?", "ok": "A y E", "d": ["A y B", "B, C y D", "E y F"], "j": "A es el 5/L3 del contactor y E el 6/T3 del térmico. Los pequeños (A1, 13, A2, 95, 96, 98) son de mando.", "img": "fig12.png", "cap": "El contactor -KM1 con el térmico -F2 enchufado debajo, tal como lo ves en el panel. Algunos tornillos están marcados con letras."}, {"tema": "T4", "t": "T4 · 4.1 / T2 · 2.3", "dif": "M", "tipo": "APA", "q": "¿A qué tornillo marcado llevas el neutro del mando?", "ok": "D", "d": ["B", "G", "A"], "j": "D es A2 de la bobina: A1 suele ir a la fase y A2 al neutro.", "img": "fig12.png", "cap": "El contactor -KM1 con el térmico -F2 enchufado debajo, tal como lo ves en el panel. Algunos tornillos están marcados con letras."}, {"tema": "T4", "t": "T4 · 4.1 / 4.4", "dif": "D", "tipo": "APA", "q": "En el arranque directo, el cable que sale del tornillo 2 de -Q2 (mando) llega al térmico. ¿A qué tornillo?", "ok": "F", "d": ["G", "H", "E"], "j": "El 95-96 va arriba del todo en el mando, justo después de -Q2: entra por el 95 (F) y sale por el 96 (G).", "img": "fig12.png", "cap": "El contactor -KM1 con el térmico -F2 enchufado debajo, tal como lo ves en el panel. Algunos tornillos están marcados con letras."}, {"tema": "T4", "t": "T4 · 4.1 (en el taller)", "dif": "D", "tipo": "APA", "q": "Un alumno ha metido en B el cable grueso de L3 que viene de -Q1. ¿En qué tornillo tenía que ir?", "ok": "En A", "d": ["En C", "En D", "En E"], "j": "B es A1 y está pegado al 5/L3 (A): es la confusión más típica del contactor.", "img": "fig12.png", "cap": "El contactor -KM1 con el térmico -F2 enchufado debajo, tal como lo ves en el panel. Algunos tornillos están marcados con letras."}, {"tema": "T4", "t": "P3 · medida 3", "dif": "D", "tipo": "MED", "q": "Sin tensión, después de pulsar TEST, ¿entre qué tornillos tiene que pitar el polímetro?", "ok": "Entre el 97 y H", "d": ["Entre F y G", "Entre A y E", "Entre B y D"], "j": "Al disparar, el 97-98 (NA) se cierra y el 95-96 (F-G) se abre.", "img": "fig12.png", "cap": "El contactor -KM1 con el térmico -F2 enchufado debajo, tal como lo ves en el panel. Algunos tornillos están marcados con letras."}, {"tema": "T3", "t": "T3 · 3.10 / T4 · 4.7 (¡OJO!)", "dif": "D", "tipo": "SEG", "q": "¿Qué pasaría si -KM1 y -KM2 se cerraran a la vez?", "ok": "L1 y L3 quedarían unidas: cortocircuito y salta -Q1", "d": ["El motor se pararía sin más", "El motor giraría más rápido", "Saltaría el térmico -F1"], "j": "Por eso el enclavamiento en el mando no es opcional.", "img": "fig10.png", "cap": "Fuerza de la inversión de giro."}, {"tema": "T4", "t": "T4 · 4.7", "dif": "M", "tipo": "SIM", "q": "¿Por qué basta con un solo térmico -F1 para los dos sentidos?", "ok": "Porque por él pasa la corriente del motor gire hacia donde gire", "d": ["Porque -KM2 lleva su propio térmico por dentro", "Porque en sentido contrario el motor no se sobrecarga", "Porque -Q1 protege de sobrecargas el otro sentido"], "j": "-F1 está después de juntarse las salidas de los dos contactores.", "img": "fig10.png", "cap": "Fuerza de la inversión de giro."}, {"tema": "T4", "t": "T4 · 4.7 (¡OJO!)", "dif": "D", "tipo": "MAL", "q": "Al montarla, el motor gira en el mismo sentido con -KM1 que con -KM2. ¿Causa más probable?", "ok": "Se han cruzado también las entradas de -KM2 (o no se ha cruzado nada)", "d": ["Falta el enclavamiento en el mando", "El térmico está enchufado solo bajo -KM1", "Los puentes del motor están en triángulo"], "j": "Las entradas de los dos contactores van en el mismo orden (1→1, 3→3, 5→5); solo se cruza a la salida.", "img": "fig10.png", "cap": "Fuerza de la inversión de giro."}, {"tema": "T3", "t": "T3 · 3.10 (en el taller)", "dif": "D", "tipo": "MED", "q": "Antes de dar tensión, ¿qué comprobación recomiendan los apuntes?", "ok": "Continuidad entre L1 y L3 con los dos contactores en reposo: no debe pitar", "d": ["Tensión entre L1 y L3 con -Q1 subido", "La pinza en L1 con el motor en marcha", "Continuidad entre 95 y 96: no debe pitar"], "j": "Si pita entre L1 y L3 en reposo, hay una unión en el cableado del cruce: daría cortocircuito.", "img": "fig10.png", "cap": "Fuerza de la inversión de giro."}, {"tema": "T4", "t": "T4 · 4.7 (cableado)", "dif": "M", "tipo": "APA", "q": "Al cablear la salida, ¿a qué tornillo va el 2/T1 de -KM2?", "ok": "Al 6/T3 de -KM1", "d": ["Al 2/T1 de -KM1", "Al 4/T2 de -KM1", "Al 1/L1 de -KM2"], "j": "-KM2 cruza L1 y L3 a la salida: 2/T1 → 6/T3, 4/T2 → 4/T2 y 6/T3 → 2/T1.", "img": "fig10.png", "cap": "Fuerza de la inversión de giro."}, {"tema": "T4", "t": "T4 · 4.7", "dif": "D", "tipo": "SIM", "q": "Si en vez de cruzar L1 y L3, -KM2 cruzara L1 y L2, ¿el motor giraría al revés?", "ok": "Sí: basta con cambiar dos fases cualesquiera", "d": ["No: solo funciona cambiando L1 y L3", "No: hay que cambiar las tres fases", "Sí, pero haría falta un térmico para cada contactor"], "j": "Un motor trifásico gira al revés si se cambian entre sí dos fases cualesquiera.", "img": "fig10.png", "cap": "Fuerza de la inversión de giro."}, {"tema": "T4", "t": "P3 · medida 5 (¡OJO!)", "dif": "D", "tipo": "MED", "q": "Montaje de la 3.1 (los tres 95-96 en serie). En reposo, punta negra en N y roja en el 96 de -F3: lees 0 V. ¿Qué haces?", "ok": "Hay un 95-96 abierto antes: mides en el 96 de -F2 y en el de -F1 hasta ver dónde se pierde", "d": ["Nada: en reposo es lo normal", "Cambias -F3, que está en cortocircuito", "Pones el polímetro en continuidad sin quitar la tensión"], "j": "En reposo tienes que leer 230 V: la fase llega hasta ahí si los tres 95-96 están cerrados.", "img": null, "cap": ""}, {"tema": "T4", "t": "T4 · 4.3 (¡OJO!)", "dif": "M", "tipo": "MAL", "q": "Un alumno dibuja la fuerza con el térmico -F1 encima del contactor -KM1. ¿Qué le dices?", "ok": "El orden es -Q1 → -KM1 → -F1 → motor", "d": ["Da igual el orden", "El térmico va antes de -Q1", "El térmico va debajo del motor"], "j": "Además, en el panel el térmico va enchufado justo debajo del contactor.", "img": null, "cap": ""}, {"tema": "T4", "t": "T4 · 4.5 / P3 (en el taller)", "dif": "D", "tipo": "APA", "q": "Tienes que llevar la fase del 2 de -Q1 a los tornillos 1 de tres contactores. ¿Cómo lo haces?", "ok": "Del 2 de -Q1 a una regleta, y de la regleta un cable a cada contactor", "d": ["Metiendo los tres cables en el tornillo 2 de -Q1", "Poniendo un -Q1 para cada contactor", "Uniendo el 1 de un contactor con el 2 del siguiente"], "j": "Nunca se meten tres cables en un mismo tornillo; las «barras» del esquema son regletas o peines.", "img": null, "cap": ""}, {"tema": "T4", "t": "T4 · 4.8 (en el taller)", "dif": "D", "tipo": "APA", "q": "¿Cómo se conectan los motores del aula en su placa de bornes?", "ok": "En triángulo: puentes U1-W2, V1-U2 y W1-V2, y las fases por U1, V1 y W1", "d": ["Sin puentes: las fases van a U2, V2 y W2", "Con los tres de abajo unidos (W2, U2 y V2) y las fases por arriba", "Da igual cómo estén los puentes"], "j": "La línea del aula es de 230 V trifásica y los motores son de 230/400 V: van en triángulo.", "img": null, "cap": ""}, {"tema": "T4", "t": "T4 · 4.2 (en el taller) / P3", "dif": "M", "tipo": "SEG", "q": "¿A qué valor se ajusta la ruleta Ir del relé térmico?", "ok": "A la intensidad nominal (In) de la placa del motor", "d": ["A lo que marca la pinza con el motor en vacío", "Al máximo, para que no salte sin motivo", "A los amperios de -Q1"], "j": "Muy alta, el térmico no protege; muy baja, salta sin motivo.", "img": null, "cap": ""}, {"tema": "T4", "t": "T4 · 4.2 (disyuntor)", "dif": "M", "tipo": "APA", "q": "En el cuadro de una fábrica ves disyuntores (guardamotores). ¿Dónde está la protección térmica?", "ok": "Dentro del disyuntor, que hace el trabajo de -Q1 y del térmico a la vez", "d": ["En un relé térmico aparte, debajo del contactor", "En el contactor", "No tiene: el disyuntor solo protege contra cortocircuitos"], "j": "El disyuntor lleva dentro el magnético y el térmico ajustable con su ruleta Ir.", "img": null, "cap": ""}, {"tema": "T4", "t": "P3 · 3.3 (pista)", "dif": "D", "tipo": "SIM", "q": "Para que se pare todo si saltan dos o más térmicos, ¿por qué se usa el 97-98 y un relé por térmico?", "ok": "Porque el 95-96 ya está ocupado parando su motor", "d": ["Porque el 95-96 no se abre al saltar", "Porque el 97-98 es NC", "Porque los relés aguantan más corriente que el térmico"], "j": "El 97-98 (NA) se cierra al saltar y activa -KA2, -KA3 o -KA4; con sus NC se monta la cadena.", "img": null, "cap": ""}, {"tema": "T4", "t": "P3 · 3.3 (idea clave)", "dif": "D", "tipo": "SIM", "q": "En la cadena de «dos o más», ¿cómo se vigila la pareja de -KA2 y -KA3?", "ok": "Con un NC de cada uno en paralelo: solo se corta si están los dos activados", "d": ["Con un NC de cada uno en serie", "Con un NA de cada uno en paralelo", "Con un NA de cada uno en serie"], "j": "Dos NC en paralelo: el camino se corta solo cuando se abren los dos. Las tres parejas van en serie.", "img": null, "cap": ""}, {"tema": "T4", "t": "P3 · esquema de fuerza (¡OJO!)", "dif": "M", "tipo": "SEG", "q": "Has terminado de cablear la Práctica 3. ¿Cuándo das tensión a la fuerza?", "ok": "Cuando el profesor lo haya revisado; antes se prueba el mando con los motores sin conectar", "d": ["En cuanto termines de cablear", "Antes de cablear el mando, para probar los motores", "Cuando veas que el mando no funciona"], "j": "Se cablea siempre sin tensión y la fuerza no se conecta hasta que el profesor revisa el montaje.", "img": null, "cap": ""}, {"tema": "T4", "t": "T4 · 4.6 B / P3 · 3.2 (cuestión 1)", "dif": "D", "tipo": "PULSA", "q": "-F2 ha saltado. Pulsas la marcha total -S5. ¿Qué contactores arrancan?", "ok": "-KM1 y -KM3", "d": ["Los tres", "Ninguno", "Solo -KM2"], "j": "-KA1 se activa, pero en la rama de -KM2 el 95-96 de -F2 está abierto antes del paralelo de marchas.", "img": "fig11.png", "cap": "Tres motores: cada térmico para solo su motor (Práctica 3, apartado 3.2). -H1 verde: los tres en marcha · -H2 rojo: alguno parado."}, {"tema": "T4", "t": "P3 · 3.2 (cuestión 2)", "dif": "D", "tipo": "PULSA", "q": "-F2 ha saltado y -KM1 y -KM3 están en marcha. ¿Qué piloto está encendido?", "ok": "-H2 (rojo)", "d": ["-H1 (verde)", "Los dos", "Ninguno"], "j": "-H1 necesita los tres 53-54 cerrados (serie). El 61-62 de -KM2 está cerrado y enciende -H2 (paralelo).", "img": "fig11.png", "cap": "Tres motores: cada térmico para solo su motor (Práctica 3, apartado 3.2). -H1 verde: los tres en marcha · -H2 rojo: alguno parado."}, {"tema": "T4", "t": "T4 · 4.6 B", "dif": "M", "tipo": "PULSA", "q": "Los tres motores están en marcha y salta -F1. ¿Qué pasa?", "ok": "Se para solo -KM1", "d": ["Se paran los tres", "No se para ninguno", "Se paran -KM2 y -KM3"], "j": "Cada 95-96 está en la rama de su contactor: solo deja sin corriente a su bobina.", "img": "fig11.png", "cap": "Tres motores: cada térmico para solo su motor (Práctica 3, apartado 3.2). -H1 verde: los tres en marcha · -H2 rojo: alguno parado."}, {"tema": "T4", "t": "T4 · 4.6 (ejemplo)", "dif": "M", "tipo": "SIM", "q": "¿Para qué máquina es adecuado este montaje (cada térmico para solo su motor)?", "ok": "Tres bombas de riego independientes", "d": ["Una cinta transportadora con tres motores en cadena", "Un motor que gira en los dos sentidos", "Una prensa con mando a dos manos"], "j": "Si una bomba se avería, las otras pueden seguir. En una cinta en cadena hay que parar todo (opción A).", "img": "fig11.png", "cap": "Tres motores: cada térmico para solo su motor (Práctica 3, apartado 3.2). -H1 verde: los tres en marcha · -H2 rojo: alguno parado."}, {"tema": "T4", "t": "T4 · 4.6 / P3 · 3.1-3.2", "dif": "D", "tipo": "MAL", "q": "¿Qué cambia este esquema respecto al de la 3.1, donde cualquier térmico para todo?", "ok": "Los 95-96 pasan de estar en serie antes de -S4 a estar cada uno en su rama", "d": ["Se cambian los 95-96 por los 97-98", "Se quita el relé -KA1", "Los 95-96 pasan a estar entre las bobinas y el neutro"], "j": "Es el mismo contacto, solo cambia de sitio (P3, pista de la 3.2).", "img": "fig11.png", "cap": "Tres motores: cada térmico para solo su motor (Práctica 3, apartado 3.2). -H1 verde: los tres en marcha · -H2 rojo: alguno parado."}, {"tema": "T4", "t": "P3 · 3.2 (¿Por qué?)", "dif": "D", "tipo": "MAL", "q": "Si el 95-96 de -F1 se pusiera entre el nudo de los 4 (salida del paralelo) y A1 de -KM1, ¿funcionaría?", "ok": "Sí: al abrirse deja sin corriente solo a -KM1", "d": ["No: el térmico dejaría de proteger el motor", "No: -KM1 ya no podría realimentarse nunca", "No: se pararían los tres motores"], "j": "Sigue estando en serie con la bobina de -KM1 y con nada más; los apuntes dicen que también funciona.", "img": "fig11.png", "cap": "Tres motores: cada térmico para solo su motor (Práctica 3, apartado 3.2). -H1 verde: los tres en marcha · -H2 rojo: alguno parado."}, {"tema": "T3", "t": "P2 · 2.3 / R3 · 12", "dif": "M", "tipo": "PULSA", "q": "-KM1 y -KM2 en marcha y -KM3 parado. ¿Qué pilotos están encendidos?", "ok": "Solo -H2", "d": ["-H1 y -H2", "Solo -H1", "Ninguno"], "j": "La serie de 53-54 está cortada por -KM3; su 61-62 está cerrado y enciende -H2.", "img": "fig11.png", "cap": "Tres motores: cada térmico para solo su motor (Práctica 3, apartado 3.2). -H1 verde: los tres en marcha · -H2 rojo: alguno parado."}];

const TEMAS = {T1:"T1 Esquemas básicos",T2:"T2 Dispositivos básicos",T3:"T3 Conexionado básico II",T4:"T4 Esquemas de fuerza"};
const TIPO = {SIM:"Símbolo / borne",PULSA:"Qué pasa al pulsar",MAL:"Qué está mal",APA:"Aparato real",MED:"Medidas",SEG:"Seguridad"};
const app = document.getElementById('app');

/* ---------- tema claro/oscuro ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('tema'); if (t) root.dataset.theme = t; } catch(e) {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('tema', root.dataset.theme); } catch(e) {}
};

/* ---------- zoom de esquemas ---------- */
const zoom = document.getElementById('zoom');
zoom.onclick = () => zoom.style.display = 'none';
function openZoom(src){ zoom.querySelector('img').src = src; zoom.style.display = 'flex'; }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (zoom.style.display === 'flex') { zoom.style.display = 'none'; return; }
    location.href = 'index.html#tests'; return;
  }
  if (e.key === 'Backspace' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    location.href = 'index.html#tests'; return;
  }
  if (state.screen !== 'q') return;
  const k = e.key.toLowerCase();
  const idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (!state.answered && idx >= 0) { answer(idx); e.preventDefault(); }
  else if (state.answered && (e.key === 'Enter' || e.key === ' ')) { next(); e.preventDefault(); }
});

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let state = { screen: 'start' };

/* ---------- inicio ---------- */
function start(){
  state = { screen: 'start' };
  const cnt = t => DATA.filter(q => q.tema === t).length;
  app.innerHTML = `
  <h1>Test de repaso · <span>Automatismos</span></h1>
  <p class="sub">${DATA.length} preguntas de los temas 1 a 4 y las prácticas 1 a 3. Recuerda: <b>borne = tornillo</b> del aparato.</p>
  <div class="card">
    <fieldset><legend>Temas</legend><div class="chips">
      ${Object.keys(TEMAS).map(t => `<label class="chip"><input type="checkbox" name="tema" value="${t}" checked><span>${TEMAS[t]} <span class="cnt">(${cnt(t)})</span></span></label>`).join('')}
    </div></fieldset>
    <fieldset><legend>Dificultad</legend><div class="chips">
      <label class="chip"><input type="radio" name="dif" value="all" checked><span>Todas</span></label>
      <label class="chip"><input type="radio" name="dif" value="M"><span>Medias</span></label>
      <label class="chip"><input type="radio" name="dif" value="D"><span>Difíciles</span></label>
    </div></fieldset>
    <fieldset><legend>Número de preguntas</legend><div class="chips">
      ${[10,20,40].map((n,i) => `<label class="chip"><input type="radio" name="num" value="${n}" ${i===1?'checked':''}><span>${n}</span></label>`).join('')}
      <label class="chip"><input type="radio" name="num" value="0"><span>Todas</span></label>
    </div></fieldset>
    <p id="avail" class="cnt"></p>
    <button class="go" id="go">Empezar</button>
  </div>
  <div class="box"><span class="lbl">CÓMO FUNCIONA</span>
    Elige una respuesta tocándola (o con las teclas A, B, C, D). Aciertes o no, verás <b>por qué</b> es esa la respuesta.
    Toca un esquema para verlo en grande. Las preguntas y el orden de las respuestas cambian cada vez.</div>`;
  const upd = () => {
    const pool = filtered();
    document.getElementById('avail').textContent = `Hay ${pool.length} preguntas con estos filtros.`;
    document.getElementById('go').disabled = pool.length === 0;
  };
  app.querySelectorAll('input').forEach(i => i.onchange = upd);
  upd();
  document.getElementById('go').onclick = () => {
    const n = +app.querySelector('input[name=num]:checked').value;
    let pool = shuffle(filtered());
    if (n) pool = pool.slice(0, n);
    state = { screen: 'q', list: pool.map(q => ({ q, order: shuffle([0,1,2,3]), pick: null })), i: 0, ok: 0, answered: false };
    show();
  };
}
function filtered(){
  const temas = [...app.querySelectorAll('input[name=tema]:checked')].map(i => i.value);
  const dif = app.querySelector('input[name=dif]:checked').value;
  return DATA.filter(q => temas.includes(q.tema) && (dif === 'all' || q.dif === dif));
}

/* ---------- pregunta ---------- */
function opts(q){ return [q.ok, ...q.d]; } // índice 0 = correcta
function show(){
  const it = state.list[state.i], q = it.q, n = state.list.length;
  state.answered = it.pick !== null;
  const all = opts(q);
  app.innerHTML = `
  <div class="meta"><span>Pregunta <b>${state.i+1}</b> de ${n}</span>
    <span class="tag">${TEMAS[q.tema].split(' ')[0]}</span>
    <span class="tag ${q.dif==='D'?'d':''}">${q.dif==='D'?'Difícil':'Media'}</span>
    <span class="score">Aciertos: ${state.ok}</span></div>
  <div class="bar"><i style="width:${(state.i)/n*100}%"></i></div>
  <div class="card">
    ${q.img ? `<figure><img src="${IMGS[q.img]}" alt="Esquema: ${esc(q.cap)}" id="fig"><figcaption>${esc(q.cap)}</figcaption></figure>` : ''}
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${it.order.map((o,k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(all[o])}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
  const f = document.getElementById('fig'); if (f) f.onclick = () => openZoom(f.src);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  if (state.answered) paint();
  window.scrollTo({ top: 0 });
}
function answer(k){
  if (state.answered) return;
  const it = state.list[state.i];
  it.pick = k; state.answered = true;
  if (it.order[k] === 0) state.ok++;
  paint();
  const nb = document.getElementById('next'); if (nb) nb.focus({ preventScroll: true });
}
function paint(){
  const it = state.list[state.i], q = it.q;
  const good = it.order[it.pick] === 0;
  app.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.k; b.disabled = true;
    if (it.order[k] === 0) b.classList.add('right');
    else if (k === it.pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const okLetter = 'ABCD'[it.order.indexOf(0)];
  const last = state.i === state.list.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="verdict ${good?'ok':'ko'}">${good ? '✔ ¡Correcto!' : `✘ No es correcta. La buena es la ${okLetter}.`}</div>
    <div class="box why"><span class="lbl">¿POR QUÉ?</span>${esc(q.j)}</div>
    <div class="hint">Lo tienes en: ${esc(q.t)}</div>
    <div class="nav"><button class="go" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button></div>`;
  document.getElementById('next').onclick = next;
  document.querySelector('.score').textContent = `Aciertos: ${state.ok}`;
}
function next(){
  if (state.i < state.list.length - 1) { state.i++; show(); } else result();
}

/* ---------- resultado ---------- */
function result(){
  state.screen = 'end';
  const n = state.list.length, nota = (state.ok / n * 10);
  const fails = state.list.filter(it => it.order[it.pick] !== 0);
  const msg = nota >= 9 ? '¡Muy bien! Lo dominas.' : nota >= 7 ? 'Bien. Repasa los fallos.' : nota >= 5 ? 'Aprobado justo: repasa los fallos con los apuntes.' : 'Toca repasar. Mira los fallos y vuelve a intentarlo.';
  app.innerHTML = `
  <h1>Resultado</h1>
  <div class="card" style="text-align:center">
    <p class="big">${state.ok} / ${n}</p>
    <p style="margin:4px 0 0">Nota: <b>${nota.toFixed(1).replace('.',',')}</b> · ${msg}</p>
  </div>
  ${fails.length ? `<div class="card"><h2 style="margin:0 0 4px;font-size:20px">Tus fallos (${fails.length})</h2>
    ${fails.map(it => { const a = opts(it.q); return `<div class="review">
      <div class="rq">${esc(it.q.q)}${it.q.img ? ` <span class="cnt">(${esc(it.q.cap.split('. ')[0])})</span>` : ''}</div>
      <div class="ry">Tu respuesta: ${esc(a[it.order[it.pick]])}</div>
      <div class="ra">Correcta: ${esc(a[0])}</div>
      <div class="cnt">${esc(it.q.j)} · ${esc(it.q.t)}</div></div>`; }).join('')}
  </div>` : ''}
  <div class="nav" style="justify-content:center">
    ${fails.length ? '<button class="go ghost" id="redo">Repetir solo los fallos</button>' : ''}
    <button class="go" id="again">Nuevo test</button>
  </div>`;
  document.getElementById('again').onclick = start;
  const r = document.getElementById('redo');
  if (r) r.onclick = () => { state = { screen: 'q', list: shuffle(fails).map(it => ({ q: it.q, order: shuffle([0,1,2,3]), pick: null })), i: 0, ok: 0, answered: false }; show(); };
  window.scrollTo({ top: 0 });
}
start();
</script>
